<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思悦云学习App最新信息查询</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gn: #52a882;
      --gn-mid: #70bf98;
      --gn-lt: #a8d9be;
      --gn-soft: #e6f5ee;
      --gn-deep: #2e7d5a;
      --cr: #f5faf7;
      --cr-bd: #c8e0d3;
      --ink: #1a2c22;
      --ink-s: #2c4a38;
      --ink-l: #6b8c7a;
      --yw: #ffd95a;
      --yw-lt: #fff4cc;
      --yw-dk: #c9a227;
      --sh-card: 0 1px 4px rgba(46,125,90,.06), 0 4px 20px rgba(46,125,90,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cr);
      color: var(--ink);
      font-family: "Nunito", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .top {
      background: linear-gradient(135deg, var(--gn-deep) 0%, var(--gn) 58%, var(--gn-mid) 100%);
      color: #fff;
      box-shadow: 0 3px 20px rgba(46,125,90,.22);
    }
    .wrap { width: min(1180px, calc(100% - 56px)); margin: 0 auto; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; padding: 13px 0 9px; gap: 14px; }
    .head > div:first-child { flex: 1; min-width: 0; }
    h1 {
      margin: 0;
      font-family: "Baloo 2", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      font-size: 27px;
      line-height: 1.12;
      color: #fff;
      font-weight: 800;
      margin-top: 3px;
    }
    .title-line {
      display: block;
    }
    .version-badge {
      display: inline-flex;
      align-items: center;
      margin-top: 0;
      border: 1px solid rgba(255,217,90,.46);
      border-radius: 999px;
      background: rgba(255,217,90,.18);
      color: var(--yw);
      padding: 4px 11px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }
    .lock {
      border: 0;
      border-radius: 20px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      padding: 9px 12px;
      min-width: 96px;
      font-size: 13px;
      font-weight: 800;
    }
    .lock.admin { background: rgba(255,217,90,.22); color: var(--yw); border-color: rgba(255,217,90,.45); }
    .admin-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 190px; padding-top: 2px; }
    .last-updated {
      color: rgba(255,255,255,.82);
      font-size: 11.5px;
      line-height: 1.45;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }
    .internal-note {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: fit-content;
      margin-top: 6px;
      border: 1.5px solid rgba(255,217,90,.55);
      border-radius: 12px;
      background: rgba(255,244,204,.2);
      color: #fff4cc;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 900;
    }
    .support-note {
      margin-top: 5px;
      color: rgba(255,255,255,.86);
      background: rgba(26,44,34,.16);
      border: none;
      border-radius: 12px;
      padding: 5px 9px;
      font-size: 11.5px;
      line-height: 1.45;
      font-weight: 700;
      max-width: 900px;
    }
    .support-note .strong {
      color: var(--yw);
      font-size: 13px;
      font-weight: 900;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    .info { border-top: 1px solid rgba(255,255,255,.18); padding: 7px 0 8px; }
    .info-row { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; color: rgba(255,255,255,.84); font-size: 12.5px; }
    .pill { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 4px 11px; }
    .pill b { color: var(--yw-lt); font-weight: 700; margin-right: 4px; }
    main { padding: 20px 0 60px; }
    body.feature-view-open { overflow: hidden; }
    .feature-backdrop { position: fixed; inset: 0; z-index: 29; display: none; background: rgba(255,255,255,.76); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .feature-backdrop.show { display: block; }
    .feature-module[hidden] { display: none !important; }
    .feature-module { position: relative; z-index: 30; margin-bottom: 18px; border: 2px solid var(--yw-dk); border-radius: 16px; background: linear-gradient(135deg, #fffdf4 0%, var(--yw-lt) 100%); box-shadow: 0 8px 26px rgba(201,162,39,.18); }
    .feature-module.open { position: fixed; top: 3vh; left: 50%; width: min(1180px, calc(100% - 40px)); height: min(94vh, 1040px); max-height: 94vh; transform: translateX(-50%); display: flex; flex-direction: column; margin: 0; overflow: hidden; border-radius: 18px; box-shadow: 0 24px 70px rgba(26,44,34,.3); }
    .feature-toggle { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: var(--ink); padding: 17px 18px; text-align: left; }
    .feature-module.open .feature-toggle { flex: 0 0 auto; background: linear-gradient(135deg, #fffdf4 0%, var(--yw-lt) 100%); }
    .feature-icon { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px; background: var(--yw-dk); color: #fff; font-size: 21px; box-shadow: 0 4px 12px rgba(201,162,39,.22); }
    .feature-title { flex: 1; min-width: 0; font-size: 20px; line-height: 1.35; font-weight: 900; overflow-wrap: anywhere; }
    .feature-version-badge { flex: 0 0 auto; border: 1.5px solid rgba(139,108,0,.35); border-radius: 999px; background: rgba(255,255,255,.72); color: #7b6205; padding: 5px 10px; font-size: 12px; line-height: 1; font-weight: 900; white-space: nowrap; }
    .feature-arrow { color: #8b6c00; font-size: 24px; font-weight: 900; transition: transform .18s ease; }
    .feature-module.open .feature-arrow { transform: rotate(180deg); }
    .feature-detail { min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; border-top: 1.5px solid rgba(201,162,39,.32); padding: 22px; background: #fff; }
    .feature-panel { min-width: 0; min-height: 100%; border: 1.5px solid var(--cr-bd); border-radius: 13px; background: #fff; padding: 18px; box-shadow: var(--sh-card); }
    .feature-panel.student { border-top: 5px solid var(--gn-deep); }
    .feature-panel-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 16px; color: var(--ink); font-size: 18px; font-weight: 900; }
    .feature-panel-title span { color: var(--ink-l); font-size: 12px; font-weight: 800; }
    .feature-section-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; color: var(--ink); font-size: 16px; font-weight: 900; }
    .feature-section-heading small { color: var(--ink-l); font-size: 12px; font-weight: 800; }
    .feature-poster-section { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1.5px solid var(--cr-bd); }
    .feature-poster-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .feature-poster-wrap { position: relative; aspect-ratio: 3 / 4; border: 1.5px solid var(--cr-bd); border-radius: 12px; overflow: hidden; background: #fff; box-shadow: var(--sh-card); }
    .feature-poster-button { width: 100%; height: 100%; border: 0; padding: 0; background: transparent; }
    .feature-poster { width: 100%; height: 100%; display: block; object-fit: contain; background: #fff; }
    .feature-poster-label { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 66px 8px 8px; background: rgba(26,44,34,.82); color: #fff; font-size: 12px; font-weight: 900; text-align: center; pointer-events: none; }
    .feature-update-section { min-width: 0; }
    .feature-update-list { display: grid; gap: 12px; }
    .feature-update-card { position: relative; border: 1.5px solid var(--cr-bd); border-radius: 12px; background: var(--cr); padding: 14px; overflow: hidden; scroll-margin: 110px 0; }
    .feature-update-card.focus { border-color: var(--yw-dk); box-shadow: 0 0 0 4px rgba(201,162,39,.22); animation: feature-focus-pulse 1.1s ease 2; }
    @keyframes feature-focus-pulse { 50% { box-shadow: 0 0 0 8px rgba(201,162,39,.12); } }
    .feature-search-card { border-color: rgba(201,162,39,.72); background: linear-gradient(135deg, #fff 0%, #fff9df 100%); }
    .feature-search-summary { color: var(--ink-l); font-size: 12.5px; line-height: 1.55; font-weight: 700; white-space: normal; overflow-wrap: anywhere; }
    .feature-search-open { align-self: center; color: #7b6205; font-size: 12px; font-weight: 900; white-space: nowrap; }
    .feature-update-number { display: inline-flex; align-items: center; border-radius: 999px; background: var(--gn-deep); color: #fff; padding: 3px 9px; font-size: 11px; font-weight: 900; }
    .feature-update-title { margin: 8px 0 2px; color: var(--ink); font-size: 17px; line-height: 1.4; font-weight: 900; overflow-wrap: anywhere; }
    .feature-update-subtitle { color: var(--gn-deep); font-size: 13px; line-height: 1.55; font-weight: 900; white-space: pre-wrap; overflow-wrap: anywhere; }
    .feature-update-content { margin-top: 8px; color: var(--ink-s); font-size: 14px; line-height: 1.72; white-space: pre-wrap; overflow-wrap: anywhere; }
    .feature-update-image { position: relative; width: min(100%, 520px); margin-top: 12px; border: 1.5px solid var(--cr-bd); border-radius: 10px; overflow: hidden; background: #fff; }
    .feature-update-image button:first-child { display: block; width: 100%; border: 0; padding: 0; background: transparent; }
    .feature-update-image img { display: block; width: 100%; max-height: 460px; object-fit: contain; background: #fff; }
    .feature-edit-list { display: grid; gap: 14px; margin-top: 16px; }
    .feature-edit-card, .feature-poster-editor { border: 1.5px solid var(--cr-bd); border-radius: 12px; background: #fff; padding: 14px; }
    .feature-poster-editor { margin-top: 12px; border-color: var(--yw-dk); background: #fffdf4; }
    .feature-edit-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; color: var(--gn-deep); font-size: 15px; font-weight: 900; }
    .feature-edit-remove { border: 0; border-radius: 8px; background: #fbeae5; color: #9a3b3b; padding: 5px 9px; font-size: 12px; font-weight: 900; }
    .feature-edit-image-preview { position: relative; width: 130px; margin-top: 8px; border: 1.5px solid var(--cr-bd); border-radius: 9px; overflow: hidden; background: #fff; }
    .feature-edit-image-preview img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .feature-edit-image-preview button, .feature-poster-edit-item button { position: absolute; top: 5px; right: 5px; width: 25px; height: 25px; border: 0; border-radius: 50%; background: rgba(26,44,34,.85); color: #fff; padding: 0; font-weight: 900; }
    .feature-poster-edit-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .feature-poster-edit-item { position: relative; aspect-ratio: 3 / 4; border: 1.5px solid var(--cr-bd); border-radius: 9px; overflow: hidden; background: #fff; }
    .feature-poster-edit-item img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .feature-editor-modal { width: min(840px, 100%); max-height: 92vh; }
    .feature-editor-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .feature-copy { color: var(--ink-s); font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .image-download { position: absolute; right: 6px; bottom: 5px; z-index: 2; border: 1px solid rgba(255,255,255,.45); border-radius: 7px; background: rgba(255,255,255,.92); color: var(--gn-deep); padding: 4px 7px; font-size: 11px; font-weight: 900; }
    .feature-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1.5px solid var(--cr-bd);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--sh-card);
    }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; min-width: 0; color: var(--ink); font-weight: 700; }
    .clear { border: 0; background: var(--gn-soft); color: var(--gn-deep); border-radius: 6px; padding: 4px 8px; }
    .tabs, .tags, .admin-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tab, .tag {
      border: 1.5px solid var(--cr-bd);
      border-radius: 20px;
      background: #fff;
      color: var(--ink-l);
      padding: 7px 14px;
      font-weight: 800;
      font-size: 13.5px;
    }
    .tag { background: transparent; font-weight: 500; font-size: 13px; padding: 6px 13px; border-radius: 20px; }
    .primary {
      border: 0;
      border-radius: 10px;
      background: var(--gn-deep);
      color: #fff;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
    }
    .primary.warn { background: #c9a227; }
    .primary.dark { background: var(--ink); }
    .primary.gray { background: var(--ink-l); }
    .list { margin-top: 18px; }
    .directory-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .directory-columns .directory-section { min-width: 0; margin-top: 0; }
    .directory-columns .club-section { grid-column: 1 / -1; }
    .directory-section { margin-top: 24px; }
    .directory-section:first-child { margin-top: 0; }
    .directory-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      padding: 0 2px 10px;
      border-bottom: 2px solid var(--cr-bd);
    }
    .directory-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--ink);
      font-family: "Baloo 2", "PingFang SC", sans-serif;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
    }
    .directory-mark { width: 7px; height: 25px; border-radius: 4px; flex: 0 0 auto; }
    .directory-count, .category-count {
      flex: 0 0 auto;
      color: var(--ink-l);
      font-size: 12px;
      font-weight: 800;
    }
    .category-group { margin: 0 0 18px; }
    .category-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      padding: 0 2px;
    }
    .category-title {
      margin: 0;
      color: var(--ink-s);
      font-size: 16px;
      line-height: 1.4;
      font-weight: 900;
    }
    .category-line { height: 1px; min-width: 18px; flex: 1; background: var(--cr-bd); }
    .search-result-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .search-result-title { margin: 0; color: var(--ink); font-size: 18px; font-weight: 900; }
    .card {
      background: #fff;
      border: 1.5px solid var(--cr-bd);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--sh-card);
    }
    .card-head {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 14px 16px;
      color: var(--ink);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .card-title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .title { font-size: 15px; font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
    .mini-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .mini-tag {
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--cr-bd);
      border-radius: 20px;
      background: var(--gn-soft);
      color: var(--gn-deep);
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.35;
    }
    .mini-tag.error { background: #fbeae5; border-color: #d79a8b; color: #9a3b3b; }
    .mini-tag.pinned { background: #fff4bd; border-color: var(--yw-dk); color: #7b6205; }
    .pinned-group { margin: 0 0 16px; padding: 12px; border: 1.5px solid rgba(201,162,39,.55); border-radius: 14px; background: linear-gradient(135deg, #fffdf4 0%, #fff8d7 100%); }
    .pinned-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 10px; color: #7b6205; font-size: 14px; font-weight: 900; }
    .card.pinned { border-color: rgba(201,162,39,.75); box-shadow: 0 5px 18px rgba(201,162,39,.13); }
    .status-panel {
      border: 1.5px solid var(--cr-bd);
      border-left: 4px solid var(--gn);
      border-radius: 10px;
      background: var(--gn-soft);
      padding: 9px 11px;
      margin: 8px 0 10px;
      color: var(--ink-s);
      font-size: 12.5px;
      line-height: 1.55;
      font-weight: 700;
    }
    .status-panel b { color: var(--gn-deep); margin-right: 6px; }
    .status-panel.fixing { border-left-color: #c9a227; background: #fff8dc; }
    .status-panel.fixed { border-left-color: #2e7d5a; }
    .status-panel.future { border-left-color: #52a882; }
    .body { padding: 0 16px 16px 34px; }
    .crumb { color: var(--ink-l); font-size: 11.5px; font-weight: 800; margin-bottom: 6px; }
    .content { color: var(--ink-s); font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .body-link { color: var(--gn-deep); text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .body-link:hover { color: var(--gn); }
    .body-link:focus-visible { outline: 2px solid var(--gn); outline-offset: 3px; border-radius: 2px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 112px)); gap: 9px; margin-top: 12px; }
    .media-thumb-wrap { position: relative; width: 100%; aspect-ratio: 1; border: 1.5px solid var(--cr-bd); border-radius: 8px; overflow: hidden; background: var(--gn-soft); }
    .media-thumb-btn { width: 100%; height: 100%; border: 0; padding: 0; background: transparent; }
    .media-thumb { display: block; width: 100%; height: 100%; object-fit: cover; }
    .media-preview-label { position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 4px; background: rgba(26,44,34,.82); color: #fff; font-size: 11px; line-height: 1.2; font-weight: 900; text-align: center; }
    .video-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--gn-deep); background: var(--gn-soft); border: 1.5px solid var(--gn-lt); border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 800; text-decoration: none; }
    .video-player-wrap { width: min(100%, 720px); display: grid; gap: 8px; margin-top: 12px; }
    .video-player { display: block; width: 100%; max-height: 480px; border: 1.5px solid var(--cr-bd); border-radius: 10px; background: #101813; }
    .video-player-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .video-player-actions .video-link { margin-top: 0; }
    .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-l); font-size: 12px; margin-top: 12px; }
    .link-btn { border: 0; background: transparent; color: var(--gn-deep); font-weight: 800; padding: 0; }
    .link-btn.pin { color: #8b6c00; }
    .link-btn.danger { color: #9a3b3b; }
    .empty, .loading { text-align: center; color: #8b8477; padding: 42px 0; font-size: 14px; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,44,34,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .overlay.show { display: flex; }
    .modal {
      position: relative;
      width: min(480px, 100%);
      max-height: 86vh;
      overflow: auto;
      background: var(--cr);
      border-radius: 14px;
      padding: 24px 22px;
      border: 1.5px solid var(--gn-lt);
      box-shadow: 0 6px 36px rgba(46,125,90,.15);
    }
    .modal.narrow { width: min(370px, 100%); }
    .close { position: absolute; top: 14px; right: 14px; border: 0; background: var(--gn-soft); color: var(--gn-deep); border-radius: 8px; padding: 6px 9px; font-weight: 900; }
    .modal-title { font-family: "Baloo 2", "PingFang SC", sans-serif; color: var(--gn-deep); font-size: 18px; font-weight: 800; margin-bottom: 16px; }
    label { display: block; color: var(--ink-l); font-size: 11px; font-weight: 900; margin: 14px 0 6px; letter-spacing: .08em; }
    .field {
      width: 100%;
      border: 1.5px solid var(--cr-bd);
      border-radius: 9px;
      padding: 10px 12px;
      outline: 0;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }
    .field:focus { border-color: var(--gn-lt); box-shadow: 0 0 0 3px var(--gn-soft); }

    .error { color: #9a3b3b; font-size: 12px; margin-top: 8px; }
    .hint { color: var(--ink-l); font-size: 12.5px; line-height: 1.6; font-weight: 700; }
    pre { white-space: pre-wrap; background: var(--gn-soft); border: 1.5px solid var(--cr-bd); border-radius: 9px; padding: 10px 12px; color: var(--ink-s); overflow: auto; }

    .image-lightbox {

    .lightbox-close { position: fixed; top: 18px; right: 18px; width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.35); border-radius: 50%; background: rgba(0,0,0,.38); color: #fff; font-size: 24px; line-height: 1; }
    .lightbox-download { position: fixed; top: 18px; right: 72px; border: 1px solid rgba(255,255,255,.45); border-radius: 10px; background: rgba(255,255,255,.94); color: var(--gn-deep); padding: 9px 13px; font-size: 13px; font-weight: 900; }
    @media (max-width: 520px) {

    }
    @media (max-width: 820px) {
      .directory-columns { grid-template-columns: 1fr; }
      .feature-editor-modal { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="wrap">
      <div class="head">
        <div>
          <div><span id="versionBadge" class="version-badge">当前版本号：读取中</span></div>
          <div class="title-line">
            <h1>思悦云学习App最新信息查询</h1>
          </div>
          <div class="internal-note">⚠ 仅内部使用，严禁发给家长</div>
          <div class="support-note">若问题仍无法解决，请将设备信息及<span class="strong">问题详细描述</span>发给Friday。感谢您的理解和支持。</div>
        </div>
        <div class="admin-side">
          <button id="loginBtn" class="lock" title="管理员窗口">管理员窗口</button>
          <div id="lastUpdated" class="last-updated">网站最新更新日期：读取中</div>
        </div>
      </div>
      <div class="info"><div id="infoRow" class="info-row"></div></div>
    </div>
  </div>

  <main class="wrap">
    <div id="featureBackdrop" class="feature-backdrop" aria-hidden="true"></div>
    <section id="featureModule" class="feature-module" aria-label="App 最新功能"></section>
    <div class="search">
      <span>🔎</span>
      <input id="query" placeholder="输入关键词，比如朗读、积分、希沃、音频">
      <button id="clearQuery" class="clear" hidden>×</button>
    </div>
    <div id="tabs" class="tabs"></div>
