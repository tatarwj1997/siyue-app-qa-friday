    <div id="list" class="list"><div class="loading">正在打开知识库…</div></div>
  </main>

  <div id="modalLayer" class="overlay"></div>
  <div id="imageLightbox" class="image-lightbox" onclick="if(event.target===this) closeImagePreview()">
    <button id="lightboxDownload" class="lightbox-download" onclick="downloadOriginalImage(event, this.dataset.url, this.dataset.name)">⬇ 下载原图</button>
    <button class="lightbox-close" title="关闭图片预览" onclick="closeImagePreview()">×</button>
    <img id="lightboxImage" alt="图片大图预览">
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const SUPABASE_URL = "https://axtvwtlkvehtdnsdavkx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wQA_DET5R6qmYEOF02NlSg_Er-Jvk_I";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CLUB_SECTION = "思悦 Club 资源汇总";
    const sections = [
      { key: "学生端", color: "#2E7D5A" },
      { key: "智慧教室", color: "#C9A227" },
      { key: CLUB_SECTION, color: "#6B8C7A" }
    ];
    const isClubSection = (section) => section === CLUB_SECTION;
    const FEATURE_CATEGORY = "App最新功能";
    const PIN_KEYWORD_MARKER = "__KB_PINNED__";
    const FEATURE_MODULE_TITLE = "思悦云学习 App 学生端最新版上新功能";
    const FEATURE_DATA_PREFIX = "FEATURE_ITEMS_V1:";
    const FEATURE_DATA_PREFIX_V2 = "FEATURE_DATA_V2:";
    const SEARCH_STOP_CHARS = new Set(["的", "了", "呢", "吗", "啊", "呀", "吧", "哦", "着", "过", "和", "与", "及", "或", "是", "在", "有", "就", "都", "也", "又", "被", "把", "让", "给", "到", "从", "为"]);
    const categories = ["报错", "优化更新", "情况说明"];
    const categoryColors = { 报错: "#9A3B3B", 优化更新: "#2E7D5A", 情况说明: "#6B8C7A" };
    const fixStatuses = ["修复中", "已修复", "后续优化"];
    const fixStatusColors = { 修复中: "#C9A227", 已修复: "#2E7D5A", 后续优化: "#52A882" };
    const DEFAULT_FIXING_NOTE = "修复中，请耐心等待。修复完成会在教学群内通知各位老师。";
    const state = {
      items: [],
      info: [],
      lastUpdatedAt: "",
      adminPassword: localStorage.getItem("kb-admin-password") || "",
      isAdmin: false,
      query: "",
      section: null,
      category: null,
      fixStatus: null,
      expanded: new Set(),
      knownItemIds: new Set(),
      pendingImageFiles: [],
      pendingVideoFile: null,
      featureDraftVersion: "",
      featureDraftPosters: [],
      featureDraftItems: [],
      featureOpen: false,
      featureFocusIndex: null,
      featureEditing: false
    };
    let loadPromise = null;
    let toastTimer = null;
    let liveChannel = null;
    let videoSelectionToken = 0;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
    function linkifyText(value) {
      const text = String(value ?? "");
      const pattern = /(?:https?:\/\/|www\.)[^\s<>"'`，。；：！？、【】（）“”‘’《》]+/gi;
      let html = "";
      let cursor = 0;
      for (const match of text.matchAll(pattern)) {
        let label = match[0];
        // Keep sentence punctuation outside links, while retaining balanced URL brackets.
        while (label) {
          const last = label.at(-1);
          const opening = { ")": "(", "]": "[", "}": "{" }[last];
          const unmatchedClose = opening && label.split(last).length > label.split(opening).length;
          if (/[.,;:!?]/.test(last) || unmatchedClose) label = label.slice(0, -1);
          else break;
        }
        html += esc(text.slice(cursor, match.index));
        try {
          const url = new URL(/^www\./i.test(label) ? `https://${label}` : label);
          if (!["http:", "https:"].includes(url.protocol) || !url.hostname) throw new Error("Unsupported URL");
          html += `<a class="body-link" href="${esc(url.href)}" target="_blank" rel="noopener noreferrer" title="在新标签页打开">${esc(label)}</a>${esc(match[0].slice(label.length))}`;
        } catch {
          html += esc(match[0]);
        }
        cursor = match.index + match[0].length;
      }
      return html + esc(text.slice(cursor));
    }
    const colorForCategory = (c) => categoryColors[c] || "#6B6558";
    const colorForSection = (s) => sections.find((x) => x.key === s)?.color || "#6B6558";
    const colorForFixStatus = (s) => fixStatusColors[s] || "#6B8C7A";
    const normalizeCategory = (c) => c === "更新" || c === "优化" ? "优化更新" : (c || "");
    const normalizeFixStatus = (s) => fixStatuses.includes(s) ? s : "修复中";
    const isVideoUrl = (u) => /\.(mp4|webm|mov|m4v|ogv|ogg)(\?.*)?$/i.test(u || "");
    const dateText = (d) => d ? new Date(d).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" }) : "—";
    const dateTimeText = (value) => {
      if (!value) return "暂无记录";
      const d = new Date(value);
      const pad = (number) => String(number).padStart(2, "0");
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const safeFileName = (name) => name.replace(/[^\w.\-]+/g, "_").slice(-90);
    const formatVideoDuration = (seconds) => {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    };
    const clearPendingVideoFile = () => {
      if (state.pendingVideoFile?.previewUrl) URL.revokeObjectURL(state.pendingVideoFile.previewUrl);
      state.pendingVideoFile = null;
      const input = $("editVideoFile");
      if (input) input.value = "";
    };
    const readVideoDuration = (file) => new Promise((resolve, reject) => {
      const objectUrl = URL.createObjectURL(file);
      const video = document.createElement("video");
      let settled = false;
      const timeout = window.setTimeout(() => finish(reject, new Error("读取视频时长超时，请重新选择或换成 MP4 格式。")), 12000);
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        window.clearTimeout(timeout);
        video.onloadedmetadata = null;
        video.onerror = null;
        video.removeAttribute("src");
        video.load();
        URL.revokeObjectURL(objectUrl);
        callback(value);
      };
      video.preload = "metadata";
      video.onloadedmetadata = () => {
        const duration = Number(video.duration);
        if (!Number.isFinite(duration) || duration <= 0) finish(reject, new Error("无法读取视频时长，请换成 MP4、MOV 或 WebM 格式。"));
        else finish(resolve, duration);
      };
      video.onerror = () => finish(reject, new Error("无法读取视频，请换成 MP4、MOV 或 WebM 格式。"));
      video.src = objectUrl;
    });
    const splitUrls = (value) => String(value || "").split(/\n+/).map((u) => u.trim()).filter(Boolean);
    const stripPinMarker = (value) => String(value || "").split(/\s+/).filter((token) => token && token !== PIN_KEYWORD_MARKER).join(" ");
    const isPinned = (item) => String(item?.keywords || "").split(/\s+/).includes(PIN_KEYWORD_MARKER);
    const keywordsWithPin = (value, pinned) => [stripPinMarker(value), pinned ? PIN_KEYWORD_MARKER : ""].filter(Boolean).join(" ");
    const normalizeSearchText = (value) => Array.from(String(value || "").normalize("NFKC").toLowerCase())
      .filter((char) => /[\p{L}\p{N}]/u.test(char) && !SEARCH_STOP_CHARS.has(char));
    const searchMatchScore = (query, content) => {
      const queryChars = [...new Set(normalizeSearchText(query))];
      if (!queryChars.length) return { matchedChars: 0, exactMatch: 0 };
      const compactContent = normalizeSearchText(content).join("");
      const compactQuery = normalizeSearchText(query).join("");
      const matchedChars = queryChars.filter((char) => compactContent.includes(char)).length;
      return { matchedChars, exactMatch: compactContent.includes(compactQuery) ? 1 : 0 };
    };
    const emptyFeaturePoster = () => ({ image_url: "", file: null, previewUrl: "" });
    const emptyFeatureItem = () => ({ title: "", subtitle: "", content: "", image_url: "", file: null, previewUrl: "" });
    const normalizeFeaturePoster = (poster) => ({
      image_url: String(typeof poster === "string" ? poster : (poster?.image_url || "")),
      file: null,
      previewUrl: ""
    });
    const normalizeFeatureItem = (item) => ({
      title: String(item?.title || ""),
      subtitle: String(item?.subtitle || ""),
      content: String(item?.content || ""),
      image_url: String(item?.image_url || ""),
      file: null,
      previewUrl: ""
    });
    const parseFeatureData = (feature, includeDefaults = false) => {
      let version = "";
      let posters = [];
      let items = [];
      if (feature?.content?.startsWith(FEATURE_DATA_PREFIX_V2)) {
        try {
          const parsed = JSON.parse(feature.content.slice(FEATURE_DATA_PREFIX_V2.length));
          version = String(parsed?.version || "");
          posters = Array.isArray(parsed?.posters) ? parsed.posters.map(normalizeFeaturePoster).filter((poster) => poster.image_url) : [];
          items = Array.isArray(parsed?.items) ? parsed.items.map(normalizeFeatureItem) : [];
        } catch {}
      } else if (feature?.content?.startsWith(FEATURE_DATA_PREFIX)) {
        try {
          const parsed = JSON.parse(feature.content.slice(FEATURE_DATA_PREFIX.length));
          if (Array.isArray(parsed)) items = parsed.map(normalizeFeatureItem);
        } catch {}
      } else if (feature) {
        items = [normalizeFeatureItem({
          title: feature.title || "",
          content: feature.content || "",
          image_url: splitUrls(feature.image_url)[0] || ""
        })];
      }
      if (includeDefaults && !items.length) items = Array.from({ length: 4 }, emptyFeatureItem);
      return { version, posters: posters.slice(0, 3), items };
    };

    async function init() {
      if (state.adminPassword) {
        const { data } = await db.rpc("kb_check_admin_password_v2", { p_password: state.adminPassword });
        state.isAdmin = data === true;
        if (!state.isAdmin) {
          state.adminPassword = "";
          localStorage.removeItem("kb-admin-password");
        }
      }
      await loadAll();
      startLiveSync();
    }

    async function loadAll() {
      if (loadPromise) return loadPromise;
      loadPromise = (async () => {
        const [itemsRes, infoRes, metaRes] = await Promise.all([
          db.from("kb_items").select("*").order("created_at", { ascending: false }).order("id", { ascending: false }),
          db.from("kb_basic_info").select("*").order("sort_order", { ascending: true }),
          db.from("kb_site_meta").select("updated_at").eq("id", 1).maybeSingle()
        ]);
        if (itemsRes.error || infoRes.error) {
          if (!state.items.length) {
            $("list").innerHTML = `<div class="empty">暂时无法读取内容，请稍后刷新页面。</div>`;
          }
          return;
        }
        state.items = (itemsRes.data || []).sort((a, b) => {
          const timeDiff = new Date(b.created_at || 0) - new Date(a.created_at || 0);
          return timeDiff || String(b.id).localeCompare(String(a.id));
        });
        const currentIds = new Set(state.items.map((item) => String(item.id)));
        for (const id of currentIds) {
          if (!state.knownItemIds.has(id)) state.expanded.add(id);
        }
        state.knownItemIds = currentIds;
        state.info = infoRes.data || [];
        state.lastUpdatedAt = metaRes.data?.updated_at || [
          ...state.items.map((item) => item.updated_at || item.created_at),
          ...state.info.map((item) => item.updated_at || item.created_at)
        ].filter(Boolean).sort().at(-1) || "";
        render();
      })().finally(() => { loadPromise = null; });
      return loadPromise;
    }

    function startLiveSync() {
      if (!liveChannel) {
        liveChannel = db.channel("kb-live-sync")
          .on("postgres_changes", { event: "*", schema: "public", table: "kb_items" }, () => loadAll())
          .on("postgres_changes", { event: "*", schema: "public", table: "kb_basic_info" }, () => loadAll())
          .on("postgres_changes", { event: "*", schema: "public", table: "kb_site_meta" }, () => loadAll())
          .subscribe();
      }
      window.setInterval(() => { if (!document.hidden) loadAll(); }, 10000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });
      window.addEventListener("focus", () => loadAll());
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function currentFeatureSearchItems() {
      const feature = state.items.find((item) => normalizeCategory(item.category) === FEATURE_CATEGORY);
      if (!feature) return [];
      const { version, posters, items } = parseFeatureData(feature);
      const displayVersion = version || state.info.find((entry) => /版本/.test(entry.label || ""))?.value || "";
      return items.map((item, index) => ({
        id: `feature-search-${feature.id}-${index}`,
        section: "学生端",
        category: "当前最新版功能",
        title: item.title || `更新事项 ${index + 1}`,
        content: [displayVersion ? `版本：${displayVersion}` : "", item.subtitle, item.content].filter(Boolean).join("\n"),
        image_url: [
          ...(index === 0 ? posters.map((poster) => poster.image_url) : []),
          item.image_url
        ].filter(Boolean).join("\n"),
        video_url: "",
        keywords: [FEATURE_MODULE_TITLE, "当前最新版功能", "上新", "海报", displayVersion, item.title, item.subtitle, item.content].filter(Boolean).join(" "),
        created_at: feature.created_at,
        updated_at: feature.updated_at,
        _featureSearchResult: true,
        _featureIndex: index,
        _featureVersion: displayVersion
      }));
    }

    function filteredItems() {
      const q = state.query.trim().toLowerCase();
      let list = state.items.filter((it) => normalizeCategory(it.category) !== FEATURE_CATEGORY);
      if (q) {
        list = [...currentFeatureSearchItems(), ...list];
        return list.map((it, originalIndex) => {
          const haystack = [
            it.title,
            it.content,
            it.fix_note,
            it.section,
            normalizeCategory(it.category),
            normalizeCategory(it.category) === "报错" ? normalizeFixStatus(it.fix_status) : "",
            stripPinMarker(it.keywords)
          ].filter(Boolean).join("\n").toLowerCase();
          const { matchedChars, exactMatch } = searchMatchScore(q, haystack);
          return { it, originalIndex, matchedChars, exactMatch };
        }).filter((entry) => entry.matchedChars > 0)
          .sort((a, b) =>
            b.exactMatch - a.exactMatch ||
            b.matchedChars - a.matchedChars ||
            Number(isPinned(b.it)) - Number(isPinned(a.it)) ||
            a.originalIndex - b.originalIndex
          )
          .map((entry) => entry.it);
      }
      if (state.section) list = list.filter((it) => it.section === state.section);
      if (state.category) list = list.filter((it) => normalizeCategory(it.category) === state.category);
      if (state.fixStatus) list = list.filter((it) => normalizeCategory(it.category) === "报错" && normalizeFixStatus(it.fix_status) === state.fixStatus);
      return list;
    }

    function render() {
      renderHeader();
      renderFeature();
      renderFilters();
      renderAdminTools();
      renderList();
    }

    function renderFeature() {
      document.body.classList.toggle("feature-view-open", state.featureOpen && !state.featureEditing);
      if (state.featureEditing) {
        $("featureModule").className = "feature-module";
        $("featureModule").hidden = true;
        $("featureBackdrop").className = "feature-backdrop";
        $("featureBackdrop").setAttribute("aria-hidden", "true");
        return;
      }
      $("featureModule").hidden = false;
      const feature = state.items.find((it) => normalizeCategory(it.category) === FEATURE_CATEGORY);
      const { version, posters, items } = parseFeatureData(feature);
      const fallbackVersion = state.info.find((entry) => /版本/.test(entry.label || ""))?.value || "";
      const displayVersion = version || fallbackVersion;
      const posterCards = posters.map((poster, index) => `
        <div class="feature-poster-wrap">
          <button class="feature-poster-button" data-url="${esc(poster.image_url)}" data-alt="最新功能海报 ${index + 1}" onclick="openImagePreview(this.dataset.url, this.dataset.alt)">
            <img class="feature-poster" src="${esc(poster.image_url)}" alt="最新功能海报 ${index + 1}" onerror="this.parentElement.parentElement.style.display='none'">
          </button>
          <span class="feature-poster-label">海报 ${index + 1} · 点击预览</span>
          <button class="image-download" data-url="${esc(poster.image_url)}" data-name="最新功能海报${index + 1}" onclick="downloadOriginalImage(event, this.dataset.url, this.dataset.name)">下载原图</button>
        </div>`).join("");
      const itemCards = items.map((item, index) => `
        <article id="feature-update-${index}" class="feature-update-card${state.featureFocusIndex === index ? " focus" : ""}">
          <span class="feature-update-number">更新事项 ${index + 1}</span>
          <h3 class="feature-update-title">${esc(item.title || `更新事项 ${index + 1}`)}</h3>
          ${item.subtitle?.trim() ? `<div class="feature-update-subtitle">${linkifyText(item.subtitle)}</div>` : ""}
          <div class="feature-update-content">${linkifyText(item.content || "暂无详细介绍。")}</div>
          ${item.image_url ? `<div class="feature-update-image">
            <button data-url="${esc(item.image_url)}" data-alt="${esc(item.title || `更新事项 ${index + 1}`)} 图片" onclick="openImagePreview(this.dataset.url, this.dataset.alt)">
              <img src="${esc(item.image_url)}" alt="${esc(item.title || `更新事项 ${index + 1}`)} 图片" onerror="this.parentElement.parentElement.style.display='none'">
            </button>
            <button class="image-download" data-url="${esc(item.image_url)}" data-name="${esc(item.title || `更新事项${index + 1}`)}" onclick="downloadOriginalImage(event, this.dataset.url, this.dataset.name)">下载原图</button>
          </div>` : ""}
        </article>`).join("");
      const posterSection = posters.length ? `
        <section class="feature-poster-section">
          <div class="feature-section-heading"><span>最新功能海报</span><small>${posters.length} 张</small></div>
          <div class="feature-poster-grid">${posterCards}</div>
        </section>` : "";
      const detail = `
        <div class="feature-detail">
          <article class="feature-panel student">
            <h2 class="feature-panel-title">学生端 <span>${displayVersion ? `版本 ${esc(displayVersion)} · ` : ""}${posters.length ? `${posters.length} 张海报 · ` : ""}${items.length} 项更新</span></h2>
            ${posterSection}
            <section class="feature-update-section">
              <div class="feature-section-heading"><span>更新事项</span><small>${items.length} 项</small></div>
              ${items.length ? `<div class="feature-update-list">${itemCards}</div>` : `<div class="feature-copy">${state.isAdmin ? "还没有发布更新事项，请点击下方按钮添加。" : "暂无最新功能介绍。"}</div>`}
            </section>
            ${state.isAdmin ? `<div class="feature-actions"><button class="primary" onclick="openFeatureEditor()">${feature ? "编辑海报与更新事项" : "＋ 添加海报与更新事项"}</button>${items.length ? `<button class="primary gray" onclick="requestArchiveFeatureItems()">一键转为学生端情况说明</button>` : ""}</div>` : ""}
          </article>
        </div>`;
      $("featureModule").className = `feature-module${state.featureOpen ? " open" : ""}`;
      $("featureBackdrop").className = `feature-backdrop${state.featureOpen ? " show" : ""}`;
      $("featureBackdrop").setAttribute("aria-hidden", state.featureOpen ? "false" : "true");
      $("featureModule").innerHTML = `
        <button id="featureToggle" class="feature-toggle" aria-expanded="${state.featureOpen}">
          <span class="feature-icon">✨</span>
          <span class="feature-title">${FEATURE_MODULE_TITLE}</span>
          ${displayVersion ? `<span class="feature-version-badge">版本 ${esc(displayVersion)}</span>` : ""}
          <span class="feature-arrow">⌄</span>
        </button>${state.featureOpen ? detail : ""}`;
      $("featureToggle").addEventListener("click", (event) => {
        event.stopPropagation();
        state.featureOpen = !state.featureOpen;
        if (!state.featureOpen) state.featureFocusIndex = null;
        renderFeature();
      });
      if (state.featureOpen && Number.isInteger(state.featureFocusIndex)) {
        window.requestAnimationFrame(() => $("feature-update-" + state.featureFocusIndex)?.scrollIntoView({ behavior: "smooth", block: "center" }));
      }
    }

    window.openFeatureSearchResult = (index, event) => {
      event?.stopPropagation();
      state.featureFocusIndex = Number(index);
      state.featureOpen = true;
      renderFeature();
    };

    window.requestArchiveFeatureItems = () => {
      const feature = state.items.find((item) => normalizeCategory(item.category) === FEATURE_CATEGORY);
      const { version, items } = parseFeatureData(feature);
      const meaningfulItems = items.filter((item) => item.title.trim() || item.content.trim());
      if (!feature || !meaningfulItems.length) {
        showToast("当前没有可归档的更新事项");
        return;
      }
      state.featureOpen = false;
      renderFeature();
      const displayVersion = version || state.info.find((entry) => /版本/.test(entry.label || ""))?.value || "";
      modal(`
        <div class="modal-title">一键转为学生端情况说明</div>
        <div class="hint">将把当前 ${meaningfulItems.length} 个更新事项分别生成普通的“学生端 · 情况说明”。版本号、正文和图片会保留，顶部海报会并入第一条内容。归档完成后会打开空白的新版本编辑页。</div>
        <div class="status-panel" style="margin-top:12px"><b>${displayVersion ? `版本 ${esc(displayVersion)}` : "当前版本"}</b>${meaningfulItems.map((item) => esc(item.title || "未命名更新事项")).join("、")}</div>
        <div id="archiveFeatureError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="archiveFeatureItems(event)">确认归档并准备新版本</button>
      `, true);
    };

    window.archiveFeatureItems = async (event) => {
      const button = event?.currentTarget;
      if (button) button.disabled = true;
      try {
        const feature = state.items.find((item) => normalizeCategory(item.category) === FEATURE_CATEGORY);
        const { version, posters, items } = parseFeatureData(feature);
        const displayVersion = version || state.info.find((entry) => /版本/.test(entry.label || ""))?.value || "";
        const meaningfulItems = items.filter((item) => item.title.trim() || item.content.trim());
        if (!feature || !meaningfulItems.length) throw new Error("当前没有可归档的更新事项。");
        let createdCount = 0;
        for (let index = 0; index < meaningfulItems.length; index += 1) {
          const item = meaningfulItems[index];
          const title = item.title.trim() || `更新事项 ${index + 1}`;
          const content = [displayVersion ? `版本：${displayVersion}` : "", item.subtitle.trim(), item.content.trim()].filter(Boolean).join("\n");
          const imageUrls = [
            ...(index === 0 ? posters.map((poster) => poster.image_url) : []),
            item.image_url
          ].filter(Boolean).slice(0, 5);
          const alreadyExists = state.items.some((row) =>
            row.section === "学生端" &&
            normalizeCategory(row.category) === "情况说明" &&
            String(row.title || "").trim() === title &&
            String(row.content || "").trim() === content
          );
          if (alreadyExists) continue;
          const res = await db.rpc("kb_admin_save_item_v2", {
            p_password: state.adminPassword,
            p_id: null,
            p_section: "学生端",
            p_category: "情况说明",
            p_title: title,
            p_content: content,
            p_fix_status: "已修复",
            p_fix_note: "",
            p_image_url: imageUrls.join("\n"),
            p_video_url: "",
            p_keywords: [displayVersion, title, item.subtitle, item.content].filter(Boolean).join(" ")
          });
          if (res.error) throw res.error;
          const saved = Array.isArray(res.data) ? res.data[0] : res.data;
          if (saved?.id) state.items.unshift(saved);
          createdCount += 1;
        }
        closeModal();
        await loadAll();
        showToast(createdCount ? `已归档 ${createdCount} 条学生端情况说明` : "这些内容已经归档过了");
        openFeatureEditor(true);
      } catch (error) {
        $("archiveFeatureError").textContent = `归档失败：${error.message || "请重新登录管理员窗口。"}`;
        if (button) button.disabled = false;
      }
    };

    window.openFeatureEditor = (resetForNewVersion = false) => {
      state.featureOpen = false;
      state.featureFocusIndex = null;
      state.featureEditing = true;
      renderFeature();
      for (const entry of state.pendingImageFiles) URL.revokeObjectURL(entry.previewUrl);
      state.pendingImageFiles = [];
      const it = state.items.find((item) => normalizeCategory(item.category) === FEATURE_CATEGORY) || {
        section: "学生端", category: FEATURE_CATEGORY, title: "", content: "", fix_status: "修复中", fix_note: "", image_url: "", video_url: "", keywords: ""
      };
      const draft = resetForNewVersion
        ? { version: "", posters: [], items: Array.from({ length: 4 }, emptyFeatureItem) }
        : parseFeatureData(it.id ? it : null, true);
      state.featureDraftVersion = resetForNewVersion ? "" : (draft.version || state.info.find((entry) => /版本/.test(entry.label || ""))?.value || "");
      state.featureDraftPosters = draft.posters;
      state.featureDraftItems = draft.items;
      modal(`
        <div class="modal-title">编辑学生端最新功能</div>
        <div class="hint">${resetForNewVersion ? "旧版已归档，请在这里录入下一版本；保存前，旧版仍会继续在线展示。" : "版本号会直接显示在上新功能标题旁。海报最多3张，保存后会优先展示在最上方；下方为可添加或删除的更新事项。"}</div>
        <label>本次上新版本号</label>
        <input id="featureVersion" class="field" value="${esc(state.featureDraftVersion)}" placeholder="例如：1.6.0" oninput="state.featureDraftVersion = this.value">
        <section class="feature-poster-editor">
          <div class="feature-edit-head"><span>顶部海报</span><span id="featurePosterCount"></span></div>
          <label>海报图片（最多3张，可分多次选择）</label>
          <input id="featurePosterFiles" class="field" type="file" accept="image/*" multiple onchange="selectFeaturePosters(this)">
          <div id="featurePosterEditList"></div>
        </section>
        <div id="featureEditList" class="feature-edit-list"></div>
        <div class="feature-editor-toolbar"><button class="primary gray" onclick="addFeatureItem()">＋ 添加更新事项</button></div>
        <div id="editError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="saveFeatureItems(event, '${it.id || ""}')">保存海报与全部更新事项</button>
      `, false, "feature-editor-modal");
      renderFeatureEditor();
    };

    function renderFeatureEditor() {
      const posterCount = state.featureDraftPosters.length;
      $("featurePosterCount").textContent = `${posterCount}/3 张`;
      const posterInput = $("featurePosterFiles");
      posterInput.disabled = posterCount >= 3;
      posterInput.value = "";
      $("featurePosterEditList").innerHTML = posterCount ? `<div class="feature-poster-edit-grid">${state.featureDraftPosters.map((poster, index) => {
        const preview = poster.previewUrl || poster.image_url;
        return `<div class="feature-poster-edit-item"><img src="${esc(preview)}" alt="海报${index + 1}"><button title="移除海报" onclick="removeFeaturePoster(${index})">×</button></div>`;
      }).join("")}</div>` : `<div class="hint" style="margin-top:8px">尚未选择海报。海报会显示在更新事项之前。</div>`;
      $("featureEditList").innerHTML = state.featureDraftItems.map((item, index) => {
        const preview = item.previewUrl || item.image_url;
        return `
          <section class="feature-edit-card">
            <div class="feature-edit-head"><span>更新事项 ${index + 1}</span><button class="feature-edit-remove" onclick="removeFeatureItem(${index})">删除此项</button></div>
            <label>主标题</label>
            <input class="field" value="${esc(item.title)}" placeholder="例如：积分商城全新上线" oninput="updateFeatureItem(${index}, 'title', this.value)">
            <label>副标题（选填，不填写则不显示）</label>
            <input class="field" value="${esc(item.subtitle)}" placeholder="例如：积分可兑换更多学习奖励" oninput="updateFeatureItem(${index}, 'subtitle', this.value)">
            <label>正文内容</label>
            <textarea class="field" placeholder="介绍功能内容、入口和使用方法" oninput="updateFeatureItem(${index}, 'content', this.value)">${esc(item.content)}</textarea>
            <label>图片（限1张）</label>
            <input class="field" type="file" accept="image/*" onchange="selectFeatureItemImage(${index}, this)">
            ${preview ? `<div class="feature-edit-image-preview"><img src="${esc(preview)}" alt="更新事项${index + 1}图片"><button title="移除图片" onclick="removeFeatureItemImage(${index})">×</button></div>` : `<div class="hint" style="margin-top:6px">尚未选择图片</div>`}
          </section>`;
      }).join("");
    }

    window.selectFeaturePosters = (input) => {
      const files = Array.from(input.files || []);
      const remaining = Math.max(0, 3 - state.featureDraftPosters.length);
      if (!remaining) {
        showToast("海报最多上传3张");
        input.value = "";
        return;
      }
      if (files.length > remaining) showToast(`海报最多3张，本次已添加前${remaining}张`);
      state.featureDraftPosters.push(...files.slice(0, remaining).map((file) => ({
        image_url: "",
        file,
        previewUrl: URL.createObjectURL(file)
      })));
      renderFeatureEditor();
    };

    window.removeFeaturePoster = (index) => {
      const [removed] = state.featureDraftPosters.splice(index, 1);
      if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
      renderFeatureEditor();
    };

    window.updateFeatureItem = (index, field, value) => {
      if (state.featureDraftItems[index] && ["title", "subtitle", "content"].includes(field)) state.featureDraftItems[index][field] = value;
    };

    window.addFeatureItem = () => {
      state.featureDraftItems.push(emptyFeatureItem());
      renderFeatureEditor();
      $("featureEditList").lastElementChild?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };

    window.removeFeatureItem = (index) => {
      const [removed] = state.featureDraftItems.splice(index, 1);
      if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
      if (!state.featureDraftItems.length) state.featureDraftItems.push(emptyFeatureItem());
      renderFeatureEditor();
    };

    window.selectFeatureItemImage = (index, input) => {
      const file = input.files?.[0];
      const item = state.featureDraftItems[index];
      if (!file || !item) return;
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      item.file = file;
      item.previewUrl = URL.createObjectURL(file);
      renderFeatureEditor();
    };

    window.removeFeatureItemImage = (index) => {
      const item = state.featureDraftItems[index];
      if (!item) return;
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      item.file = null;
      item.previewUrl = "";
      item.image_url = "";
      renderFeatureEditor();
    };

    async function uploadFeatureAsset(entry, label) {
      if (!entry.file) return entry.image_url || "";
      const path = `images/${Date.now()}-${label}-${Math.random().toString(36).slice(2, 8)}-${safeFileName(entry.file.name)}`;
      const adminDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: { headers: { "x-kb-admin-password": state.adminPassword } }
      });
      const { error } = await adminDb.storage.from("kb-media").upload(path, entry.file, {
        cacheControl: "3600",
        upsert: false,
        contentType: entry.file.type || undefined
      });
      if (error) throw error;
      return db.storage.from("kb-media").getPublicUrl(path).data.publicUrl;
    }

    const uploadFeaturePoster = (poster, index) => uploadFeatureAsset(poster, `poster-${index + 1}`);
    const uploadFeatureItemImage = (item, index) => uploadFeatureAsset(item, `item-${index + 1}`);

    window.saveFeatureItems = async (event, id) => {
      const button = event?.currentTarget;
      if (button) button.disabled = true;
      try {
        $("editError").textContent = "正在上传海报和图片并保存…";
        if (state.featureDraftPosters.length > 3) throw new Error("海报最多上传3张。");
        const savedVersion = state.featureDraftVersion.trim();
        if (!savedVersion) throw new Error("请填写本次上新版本号。");
        const meaningfulItems = state.featureDraftItems.filter((item) =>
          item.title.trim() || item.subtitle.trim() || item.content.trim() || item.image_url || item.file
        );
        if (!meaningfulItems.length) throw new Error("请至少填写一个更新事项。");
        const savedPosterUrls = [];
        for (let index = 0; index < state.featureDraftPosters.length; index += 1) {
          const url = await uploadFeaturePoster(state.featureDraftPosters[index], index);
          if (url) savedPosterUrls.push(url);
        }
        const savedItems = [];
        for (let index = 0; index < meaningfulItems.length; index += 1) {
          const item = meaningfulItems[index];
          if (!item.title.trim() || !item.content.trim()) throw new Error(`更新事项 ${index + 1} 需要填写主标题和正文内容。`);
          savedItems.push({
            title: item.title.trim(),
            subtitle: item.subtitle.trim(),
            content: item.content.trim(),
            image_url: await uploadFeatureItemImage(item, index)
          });
        }
        const encodedContent = FEATURE_DATA_PREFIX_V2 + JSON.stringify({ version: savedVersion, posters: savedPosterUrls, items: savedItems });
        const res = await db.rpc("kb_admin_save_item_v2", {
          p_password: state.adminPassword,
          p_id: id || null,
          p_section: "学生端",
          p_category: FEATURE_CATEGORY,
          p_title: FEATURE_MODULE_TITLE,
          p_content: encodedContent,
          p_fix_status: "修复中",
          p_fix_note: "",
          p_image_url: [...savedPosterUrls, ...savedItems.map((item) => item.image_url).filter(Boolean)].join("\n"),
          p_video_url: "",
          p_keywords: [savedVersion, ...savedItems.flatMap((item) => [item.title, item.subtitle, item.content])].filter(Boolean).join(" ")
        });
        if (res.error) throw res.error;
        const saved = Array.isArray(res.data) ? res.data[0] : res.data;
        if (saved?.id) {
          state.items = [saved, ...state.items.filter((item) => String(item.id) !== String(saved.id))];
        }
        closeModal();
        state.featureOpen = true;
        render();
        showToast("海报与最新功能已保存");
        await loadAll();
      } catch (error) {
        $("editError").textContent = `保存失败：${error.message || "请重新登录管理员窗口。"}`;
        if (button) button.disabled = false;
      }
    };

    function renderHeader() {
      $("loginBtn").className = state.isAdmin ? "lock admin" : "lock";
      $("loginBtn").textContent = state.isAdmin ? "管理中" : "管理员窗口";
      const versionInfo = state.info.find((f) => /版本/.test(f.label || ""));
      $("versionBadge").textContent = `版本 ${versionInfo?.value || "未填写"}`;
      $("lastUpdated").textContent = `网站最新更新日期：${dateTimeText(state.lastUpdatedAt)}`;
      const visibleInfo = state.info.filter((f) => !/版本/.test(f.label || ""));
      $("infoRow").innerHTML = "ⓘ " + visibleInfo.map((f) =>
        `<span class="pill"><b>${esc(f.label)}</b>${esc(f.value)}</span>`
      ).join("");
      if (state.isAdmin) {
        $("infoRow").innerHTML += ` <button class="link-btn" onclick="openInfoEditor()">编辑</button>`;
      }
    }

    function renderFilters() {
      $("tabs").innerHTML = [
        `<button class="tab" onclick="setSection(null)" style="${!state.section ? "background:#2A2622;color:#FAF8F4" : ""}">全部</button>`,
        ...sections.map((s) => `<button class="tab" onclick="setSection('${s.key}')" style="border-color:${s.color};color:${state.section === s.key ? "#fff" : s.color};background:${state.section === s.key ? s.color : "#fff"}">${s.key}</button>`)
      ].join("");
      $("tags").style.display = isClubSection(state.section) ? "none" : "";
      if (isClubSection(state.section)) {
        $("tags").innerHTML = "";
        return;
      }
      $("tags").innerHTML = [
        `<button class="tag" onclick="setCategory(null)" style="border-color:${colorForCategory("优化更新")};color:${state.category ? colorForCategory("优化更新") : "#fff"};background:${state.category ? "transparent" : colorForCategory("优化更新")}">全部类型</button>`,
        ...categories.map((c) => `<button class="tag" onclick="setCategory('${c}')" style="border-color:${colorForCategory(c)};color:${state.category === c ? "#fff" : colorForCategory(c)};background:${state.category === c ? colorForCategory(c) : "transparent"}">${c}</button>`)
      ].join("");
      if (state.category === "报错") {
        $("tags").innerHTML += [
          `<button class="tag" onclick="setFixStatus(null)" style="border-color:${colorForCategory("报错")};color:${state.fixStatus ? colorForCategory("报错") : "#fff"};background:${state.fixStatus ? "transparent" : colorForCategory("报错")}">全部状态</button>`,
          ...fixStatuses.map((s) => `<button class="tag" onclick="setFixStatus('${s}')" style="border-color:${colorForFixStatus(s)};color:${state.fixStatus === s ? "#fff" : colorForFixStatus(s)};background:${state.fixStatus === s ? colorForFixStatus(s) : "transparent"}">${s}</button>`)
        ].join("");
      }
    }

    function renderAdminTools() {
      $("adminTools").hidden = !state.isAdmin;
      if (!state.isAdmin) {
        $("adminTools").innerHTML = "";
        return;
      }
      $("adminTools").innerHTML = `
        <button class="primary" onclick="openEditor()">＋ 新增内容</button>
        <button class="primary warn" onclick="openImport()">批量导入</button>
        <button class="primary gray" onclick="copyBackup()">复制全部备份</button>
        <button class="primary gray" onclick="openPasswordEditor()">修改密码</button>
        <button class="primary dark" onclick="logout()">退出管理</button>
      `;
    }

    function renderList() {
      const list = filteredItems();
      const q = state.query.trim();
      const showClubEmpty = !q && !state.category && !state.fixStatus && (!state.section || isClubSection(state.section));
      if (!list.length && !showClubEmpty) {
        $("list").innerHTML = `<div class="empty">没找到相关内容，换个关键词试试</div>`;
        return;
      }
      if (q) {
        $("list").innerHTML = `
          <div class="search-result-head">
            <h2 class="search-result-title">搜索结果</h2>
            <span class="directory-count">${list.length} 条</span>
          </div>
          ${list.map(itemCard).join("")}
        `;
        return;
      }

      const visibleSections = state.section
        ? sections.filter((section) => section.key === state.section)
        : sections;
      const directories = visibleSections.map((section) => {
        const sectionItems = list.filter((it) => it.section === section.key);
        const isClub = isClubSection(section.key);
        if (!sectionItems.length && !(isClub && showClubEmpty)) return "";
        const pinnedItems = sectionItems.filter(isPinned);
        const regularSectionItems = sectionItems.filter((item) => !isPinned(item));
        const pinnedGroup = pinnedItems.length ? `
          <section class="pinned-group" aria-label="${section.key}置顶内容">
            <div class="pinned-head"><span>📌 置顶内容</span><span>${pinnedItems.length}/3 条</span></div>
            ${pinnedItems.map(itemCard).join("")}
          </section>` : "";
        const visibleCategories = state.category ? [state.category] : categories;
        const groups = pinnedGroup + (isClub ? regularSectionItems.map(itemCard).join("") : visibleCategories.map((category) => {
          const categoryItems = regularSectionItems.filter((it) => normalizeCategory(it.category) === category);
          if (!categoryItems.length) return "";
          return `
            <section class="category-group" aria-labelledby="${section.key}-${category}">
              <div class="category-head">
                <span class="dot" style="background:${colorForCategory(category)}"></span>
                <h3 id="${section.key}-${category}" class="category-title">${esc(category)}</h3>
                <span class="category-line"></span>
                <span class="category-count">${categoryItems.length} 条</span>
              </div>
              ${categoryItems.map(itemCard).join("")}
            </section>
          `;
        }).join(""));
        if (!groups && !(isClub && showClubEmpty)) return "";
        return `
          <section class="directory-section${isClub ? " club-section" : ""}" aria-labelledby="${isClub ? "club-resources" : section.key}">
            <div class="directory-head">
              <h2 id="${isClub ? "club-resources" : section.key}" class="directory-title">
                <span class="directory-mark" style="background:${section.color}"></span>
                ${esc(section.key)}
              </h2>
              <span class="directory-count">${sectionItems.length} 条内容</span>
            </div>
            ${groups || `<div class="empty">暂无资源</div>`}
          </section>
        `;
      }).join("");
      const isUnfilteredHome = !state.section && !state.category && !state.fixStatus;
      $("list").innerHTML = isUnfilteredHome ? `<div class="directory-columns">${directories}</div>` : directories;
    }

    function itemCard(it) {
      if (it._featureSearchResult) {
        const summary = it.content;
        return `
          <article class="card feature-search-card">
            <button class="card-head" onclick="openFeatureSearchResult(${it._featureIndex}, event)">
              <span class="dot" style="background:var(--yw-dk);margin-top:7px"></span>
              <span class="card-title-wrap">
                <span class="title">${esc(it.title)}</span>
                <span class="mini-tags"><span class="mini-tag" style="border-color:var(--yw-dk);color:#7b6205;background:#fff9df">当前最新版功能</span>${it._featureVersion ? `<span class="mini-tag">版本 ${esc(it._featureVersion)}</span>` : ""}</span>
                <span class="feature-search-summary">${esc(summary)}</span>
              </span>
              <span class="feature-search-open">打开查看 ›</span>
            </button>
          </article>`;
      }
      const open = state.expanded.has(String(it.id));
      const pinned = isPinned(it);
      const category = normalizeCategory(it.category);
      const showCategory = !isClubSection(it.section);
      const status = normalizeFixStatus(it.fix_status);
      return `
        <article class="card${pinned ? " pinned" : ""}">
          <button class="card-head" onclick="toggleItem('${it.id}')" aria-expanded="${open}">
            <span class="dot" style="background:${colorForCategory(category)};margin-top:7px"></span>
            <span class="card-title-wrap">
              <span class="title">${esc(it.title)}</span>
              ${showCategory || pinned ? `<span class="mini-tags">
                ${pinned ? `<span class="mini-tag pinned">📌 置顶</span>` : ""}
                ${showCategory ? `<span class="mini-tag ${category === "报错" ? "error" : ""}">${esc(category || "未分类")}</span>` : ""}
                ${showCategory && category === "报错" ? `<span class="mini-tag" style="border-color:${colorForFixStatus(status)};color:${colorForFixStatus(status)}">${esc(status)}</span>` : ""}
              </span>` : ""}
            </span>
            <span>${open ? "⌄" : "›"}</span>
          </button>
          ${open ? itemBody(it) : ""}
        </article>
      `;
    }

    function itemBody(it) {
      const category = normalizeCategory(it.category);
      const showCategory = !isClubSection(it.section);
      const status = normalizeFixStatus(it.fix_status);
      const statusClass = status === "已修复" ? "fixed" : status === "后续优化" ? "future" : "fixing";
      const imageUrls = splitUrls(it.image_url);
      const imageGrid = imageUrls.length ? `<div class="media-grid">${imageUrls.map((url, index) => `
        <div class="media-thumb-wrap">
          <button class="media-thumb-btn" title="点击放大图片" data-url="${esc(url)}" data-alt="${esc(it.title)} 图片${index + 1}" onclick="openImagePreview(this.dataset.url, this.dataset.alt)">
            <img class="media-thumb" src="${esc(url)}" alt="${esc(it.title)} 图片${index + 1}" onerror="this.parentElement.parentElement.style.display='none'">
            <span class="media-preview-label">点击预览</span>
          </button>
          <button class="image-download" data-url="${esc(url)}" data-name="${esc(it.title)}-图片${index + 1}" onclick="downloadOriginalImage(event, this.dataset.url, this.dataset.name)">下载原图</button>
        </div>`).join("")}</div>` : "";
      const videoMedia = !it.video_url ? "" : isVideoUrl(it.video_url) ? `
        <div class="video-player-wrap">
          <video class="video-player" src="${esc(it.video_url)}" controls playsinline preload="metadata"></video>
          <div class="video-player-actions"><a class="video-link" href="${esc(it.video_url)}" target="_blank" rel="noreferrer">↗ 打开原视频</a></div>
        </div>` : `<a class="video-link" href="${esc(it.video_url)}" target="_blank" rel="noreferrer">⬇ 打开视频/网盘链接</a>`;
      const media = imageGrid + videoMedia;
      const admin = state.isAdmin ? `
        <span>
          <button class="link-btn pin" onclick="togglePinnedItem('${it.id}', this)">${isPinned(it) ? "取消置顶" : "置顶"}</button>
          <button class="link-btn" onclick='openEditor(${JSON.stringify(it).replaceAll("'", "&#039;")})'>编辑</button>
          <button class="link-btn danger" onclick="requestDeleteItem('${it.id}')">删除</button>
        </span>` : "";
      return `
        <div class="body">
          <div class="crumb">${esc(it.section)} ${showCategory && category ? `<span style="color:${colorForCategory(category)}">· ${esc(category)}</span>` : ""}</div>
          ${showCategory && category === "报错" ? `<div class="status-panel ${statusClass}"><b>${esc(status)}</b>${linkifyText(it.fix_note || (status === "修复中" ? DEFAULT_FIXING_NOTE : "暂无补充说明。"))}</div>` : ""}
          <div class="content">${linkifyText(it.content)}</div>
          ${media}
          <div class="meta"><span>最后更新时间 ${dateTimeText(it.updated_at || it.created_at)}</span>${admin}</div>
        </div>
      `;
    }

    window.setSection = (s) => { state.section = state.section === s ? null : s; state.category = null; state.fixStatus = null; render(); };
    window.setCategory = (c) => { state.category = state.category === c ? null : c; state.fixStatus = null; render(); };
    window.setFixStatus = (s) => { state.fixStatus = state.fixStatus === s ? null : s; render(); };
    window.toggleItem = (id) => {
      const key = String(id);
      if (state.expanded.has(key)) state.expanded.delete(key);
      else state.expanded.add(key);
      renderList();
    };
    window.openImagePreview = (url, alt = "图片大图预览") => {
      $("lightboxImage").src = url;
      $("lightboxImage").alt = alt;
      $("lightboxDownload").dataset.url = url;
      $("lightboxDownload").dataset.name = alt;
      $("imageLightbox").classList.add("show");
    };
    window.downloadOriginalImage = async (event, url, name = "原图") => {
      event?.stopPropagation();
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("download failed");
        const blob = await response.blob();
        const extension = (blob.type.split("/")[1] || url.match(/\.([a-zA-Z0-9]+)(?:\?|$)/)?.[1] || "jpg").replace("jpeg", "jpg");
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = `${safeFileName(name) || "image"}.${extension}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      } catch {
        window.open(url, "_blank", "noopener,noreferrer");
        showToast("已打开原图，请长按或右键保存");
      }
    };
    window.closeImagePreview = () => {
      $("imageLightbox").classList.remove("show");
      $("lightboxImage").removeAttribute("src");
    };

    $("query").addEventListener("input", (e) => {
      state.query = e.target.value;
      $("clearQuery").hidden = !state.query;
      renderList();
    });
    $("clearQuery").addEventListener("click", () => {
      state.query = "";
      $("query").value = "";
      $("clearQuery").hidden = true;
      renderList();
    });
    $("loginBtn").addEventListener("click", () => state.isAdmin ? logoutAdmin() : openLogin());

    function modal(html, narrow = false, extraClass = "") {
      const modalClass = ["modal", narrow ? "narrow" : "", extraClass].filter(Boolean).join(" ");
      $("modalLayer").innerHTML = `<div class="${modalClass}"><button class="close" onclick="closeModal()">×</button>${html}</div>`;
      $("modalLayer").classList.add("show");
    }
    window.closeModal = () => {
      const restoreFeatureModule = state.featureEditing;
      for (const entry of state.pendingImageFiles) URL.revokeObjectURL(entry.previewUrl);
      state.pendingImageFiles = [];
      videoSelectionToken += 1;
      clearPendingVideoFile();
      state.featureDraftVersion = "";
      for (const poster of state.featureDraftPosters) if (poster.previewUrl) URL.revokeObjectURL(poster.previewUrl);
      state.featureDraftPosters = [];
      for (const item of state.featureDraftItems) if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      state.featureDraftItems = [];
      state.featureEditing = false;
      $("modalLayer").classList.remove("show");
      $("modalLayer").innerHTML = "";
      if (restoreFeatureModule) renderFeature();
    };
    $("modalLayer").addEventListener("click", (e) => { if (e.target.id === "modalLayer") closeModal(); });

    function openLogin() {
      modal(`
        <div class="modal-title">管理员登录</div>
        <div class="hint">非管理员请勿尝试此位置。</div>
        <label>密码</label>
        <input id="password" class="field" type="password" autocomplete="current-password" placeholder="输入管理密码">
        <div id="loginError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="login()">进入管理页面</button>
      `, true);
      setTimeout(() => $("password")?.focus(), 50);
    }

    window.login = async () => {
      const password = $("password").value;
      const { data, error } = await db.rpc("kb_check_admin_password_v2", { p_password: password });
      if (error || data !== true) {
        $("loginError").textContent = "密码不对，再试一下。";
        return;
      }
      state.adminPassword = password;
      state.isAdmin = true;
      localStorage.setItem("kb-admin-password", password);
      closeModal();
      render();
    };

    function logoutAdmin() {
      state.adminPassword = "";
      state.isAdmin = false;
      localStorage.removeItem("kb-admin-password");
      closeModal();
      render();
      showToast("已退出管理");
    }
    window.logout = logoutAdmin;

    window.openEditor = (item = null) => {
      for (const entry of state.pendingImageFiles) URL.revokeObjectURL(entry.previewUrl);
      state.pendingImageFiles = [];
      videoSelectionToken += 1;
      clearPendingVideoFile();
      const defaultSection = isClubSection(state.section) ? CLUB_SECTION : "学生端";
      const it = item || { section: defaultSection, category: isClubSection(defaultSection) ? "情况说明" : "报错", title: "", content: "", fix_status: "修复中", fix_note: DEFAULT_FIXING_NOTE, image_url: "", video_url: "", keywords: "" };
      const itemCategory = isClubSection(it.section) ? "情况说明" : normalizeCategory(it.category) || "报错";
      const itemFixStatus = normalizeFixStatus(it.fix_status);
      const itemFixNote = it.fix_note || (itemFixStatus === "修复中" ? DEFAULT_FIXING_NOTE : "");
      modal(`
        <div class="modal-title">${it.id ? "编辑内容" : "新增内容"}</div>
        <label>板块</label>
        <select id="editSection" class="field" onchange="syncEditorSection()">${sections.map((s) => `<option ${it.section === s.key ? "selected" : ""}>${s.key}</option>`).join("")}</select>
        <label>标题</label>
        <input id="editTitle" class="field" value="${esc(it.title)}" placeholder="老师会怎么搜这个问题？">
        <label>内容</label>
        <textarea id="editContent" class="field" placeholder="写清楚具体的操作步骤">${esc(it.content)}</textarea>
        <div id="categoryFields">
          <label>分类</label>
          <select id="editCategory" class="field" onchange="toggleFixFields()">
            ${categories.map((c) => `<option ${itemCategory === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
        <div id="fixFields">
          <label>当前修复状态</label>
          <select id="editFixStatus" class="field" onchange="syncFixNote()">
            ${fixStatuses.map((s) => `<option ${itemFixStatus === s ? "selected" : ""}>${s}</option>`).join("")}
          </select>
          <label>状态说明</label>
          <textarea id="editFixNote" class="field" style="min-height:72px" placeholder="例如：已提交研发排查；临时解决办法是先退出重登。">${esc(itemFixNote)}</textarea>
        </div>
        <label>图片上传（选填，最多5张，可分多次选择）</label>
        <input id="editImageFile" class="field" type="file" accept="image/*" multiple onchange="previewUpload('image')">
        <div class="hint" style="margin-top:6px">每次可选1张或多张；再次选择时，前面已选的图片会保留。</div>
        <textarea id="editImage" class="field" style="min-height:68px" placeholder="也可以粘贴图片链接；多张图片每行一个链接" oninput="renderMediaPreview('image')">${esc(it.image_url)}</textarea>
        <div id="imagePreview" class="upload-preview"></div>
        <label>视频上传（选填，最长2分钟）</label>
        <input id="editVideoFile" class="field" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v,video/ogg" onchange="previewUpload('video')">
        <div class="hint" style="margin-top:6px">可上传1个视频；选择后会先检查时长，超过2分钟不会上传。新上传的视频会替换原视频或链接。</div>
        <label>视频/百度云链接（选填）</label>
        <input id="editVideo" class="field" value="${esc(it.video_url)}" placeholder="也可以粘贴视频或网盘链接" oninput="handleVideoUrlInput()">
        <div id="videoPreview" class="upload-preview"></div>
        <div id="editError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="saveItem('${it.id || ""}')">保存</button>
      `);
      syncEditorSection();
      syncFixNote();
      renderMediaPreview("image");
      renderMediaPreview("video");
    };

    window.syncEditorSection = () => {
      const isClub = isClubSection($("editSection")?.value);
      const categoryField = $("editCategory");
      if (!categoryField) return;
      $("categoryFields").hidden = isClub;
      if (isClub) {
        if (!categoryField.disabled) categoryField.dataset.categoryBeforeClub = categoryField.value;
        categoryField.value = "情况说明";
        categoryField.disabled = true;
      } else {
        if (categoryField.disabled && categories.includes(categoryField.dataset.categoryBeforeClub)) {
          categoryField.value = categoryField.dataset.categoryBeforeClub;
        }
        categoryField.disabled = false;
        delete categoryField.dataset.categoryBeforeClub;
      }
      toggleFixFields();
    };

    window.toggleFixFields = () => {
      const box = $("fixFields");
      if (!box || !$("editCategory")) return;
      box.style.display = $("editCategory").value === "报错" ? "" : "none";
      if ($("editCategory").value === "报错") syncFixNote();
    };

    window.syncFixNote = () => {
      const statusField = $("editFixStatus");
      const noteField = $("editFixNote");
      if (!statusField || !noteField) return;
      if (statusField.value === "修复中" && !noteField.value.trim()) noteField.value = DEFAULT_FIXING_NOTE;
      if (statusField.value !== "修复中" && noteField.value.trim() === DEFAULT_FIXING_NOTE) noteField.value = "";
    };

    window.previewUpload = async (kind) => {
      const input = kind === "image" ? $("editImageFile") : $("editVideoFile");
      const files = Array.from(input?.files || []);
      if (!files.length) return;
      if (kind === "image") {
        const existingUrls = splitUrls($("editImage")?.value);
        const uniqueNewFiles = files.filter((file) => !state.pendingImageFiles.some((entry) =>
          entry.file.name === file.name && entry.file.size === file.size && entry.file.lastModified === file.lastModified
        ));
        if (existingUrls.length + state.pendingImageFiles.length + uniqueNewFiles.length > 5) {
          $("editError").textContent = "图片最多保留5张；前面已选图片仍然保留，请减少这次选择的数量。";
          input.value = "";
          return;
        }
        $("editError").textContent = "";
        state.pendingImageFiles.push(...uniqueNewFiles.map((file) => ({ file, previewUrl: URL.createObjectURL(file) })));
        input.value = "";
        renderMediaPreview("image");
      } else {
        const file = files[0];
        const token = ++videoSelectionToken;
        if (!String(file.type || "").startsWith("video/") && !/\.(mp4|webm|mov|m4v|ogv|ogg)$/i.test(file.name || "")) {
          $("editError").textContent = "请选择 MP4、MOV、WebM 或 OGV 视频文件。";
          input.value = "";
          return;
        }
        $("editError").textContent = "正在检查视频时长…";
        try {
          const duration = await readVideoDuration(file);
          if (token !== videoSelectionToken) return;
          if (duration > 120.5) {
            $("editError").textContent = `视频最长2分钟；当前视频时长约 ${formatVideoDuration(duration)}，请重新选择。`;
            input.value = "";
            return;
          }
          clearPendingVideoFile();
          state.pendingVideoFile = { file, duration, previewUrl: URL.createObjectURL(file) };
          if ($("editVideo")) $("editVideo").value = "";
          $("editError").textContent = "";
          renderMediaPreview("video");
        } catch (error) {
          if (token !== videoSelectionToken) return;
          $("editError").textContent = error.message || "无法读取视频，请重新选择。";
          input.value = "";
        }
      }
    };

    window.handleVideoUrlInput = () => {
      if ($("editVideo")?.value.trim() && state.pendingVideoFile) clearPendingVideoFile();
      renderMediaPreview("video");
    };

    window.renderMediaPreview = (kind) => {
      const url = kind === "image" ? $("editImage")?.value.trim() : $("editVideo")?.value.trim();
      if (kind === "image") {
        const urls = splitUrls(url);
        const existing = urls.map((u, index) => `<span class="preview-item"><img class="preview-img" src="${esc(u)}" alt="已上传图片${index + 1}" onerror="this.parentElement.style.display='none'"><button class="preview-remove" title="移除这张图片" onclick="removeExistingImage(${index})">×</button></span>`);
        const pending = state.pendingImageFiles.map((entry, index) => `<span class="preview-item"><img class="preview-img" src="${esc(entry.previewUrl)}" alt="待上传图片${index + 1}"><button class="preview-remove" title="移除这张图片" onclick="removePendingImage(${index})">×</button></span>`);
        $("imagePreview").innerHTML = existing.length || pending.length ? `<div class="image-preview-grid">${[...existing, ...pending].join("")}</div><div class="hint">共 ${existing.length + pending.length}/5 张</div>` : "";
      } else {
        if (state.pendingVideoFile) {
          const entry = state.pendingVideoFile;
          $("videoPreview").innerHTML = `
            <div class="video-upload-preview">
              <video class="video-player" src="${esc(entry.previewUrl)}" controls playsinline preload="metadata"></video>
              <button class="preview-remove" title="移除这个视频" onclick="removePendingVideo()">×</button>
            </div>
            <div class="file-note">待上传：${esc(entry.file.name)} · ${formatVideoDuration(entry.duration)}</div>`;
        } else if (url && isVideoUrl(url)) {
          $("videoPreview").innerHTML = `
            <div class="video-upload-preview">
              <video class="video-player" src="${esc(url)}" controls playsinline preload="metadata"></video>
              <button class="preview-remove" title="移除这个视频" onclick="removeExistingVideo()">×</button>
            </div>`;
        } else {
          $("videoPreview").innerHTML = url ? `<a class="video-link" href="${esc(url)}" target="_blank" rel="noreferrer">⬇ 打开视频/网盘链接</a>` : "";
        }
      }
    };

    window.removeExistingImage = (index) => {
      const urls = splitUrls($("editImage").value);
      urls.splice(index, 1);
      $("editImage").value = urls.join("\n");
      renderMediaPreview("image");
    };

    window.removePendingImage = (index) => {
      const [removed] = state.pendingImageFiles.splice(index, 1);
      if (removed) URL.revokeObjectURL(removed.previewUrl);
      renderMediaPreview("image");
    };

    window.removePendingVideo = () => {
      videoSelectionToken += 1;
      clearPendingVideoFile();
      renderMediaPreview("video");
    };

    window.removeExistingVideo = () => {
      if ($("editVideo")) $("editVideo").value = "";
      renderMediaPreview("video");
    };

    async function uploadImageFiles() {
      const existingUrls = splitUrls($("editImage").value);
      const files = state.pendingImageFiles.map((entry) => entry.file);
      if (existingUrls.length + files.length > 5) {
        throw new Error("图片最多保留5张，请减少已粘贴链接或重新选择文件。");
      }
      const uploadedUrls = [];
      for (const file of files) {
        const path = `images/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeFileName(file.name)}`;
        const adminDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          global: { headers: { "x-kb-admin-password": state.adminPassword } }
        });
        const { error } = await adminDb.storage.from("kb-media").upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type || undefined
        });
        if (error) throw error;
        uploadedUrls.push(db.storage.from("kb-media").getPublicUrl(path).data.publicUrl);
      }
      return [...existingUrls, ...uploadedUrls].slice(0, 5).join("\n");
    }

    async function uploadVideoFile() {
      if (!state.pendingVideoFile) return $("editVideo").value.trim();
      const file = state.pendingVideoFile.file;
      const path = `videos/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeFileName(file.name)}`;
      const adminDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: { headers: { "x-kb-admin-password": state.adminPassword } }
      });
      const { error } = await adminDb.storage.from("kb-media").upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || undefined
      });
      if (error) throw error;
      return db.storage.from("kb-media").getPublicUrl(path).data.publicUrl;
    }

    window.saveItem = async (id) => {
      const section = $("editSection").value;
      const category = isClubSection(section) ? "情况说明" : $("editCategory").value;
      let imageUrl;
      let videoUrl;
      try {
        $("editError").textContent = "正在上传文件并保存…";
        imageUrl = await uploadImageFiles();
        videoUrl = await uploadVideoFile();
      } catch (err) {
        $("editError").textContent = `上传失败：${err.message || "请确认 Supabase 上传空间已经创建。"}`;
        return;
      }
      const row = {
        section,
        category,
        title: $("editTitle").value.trim(),
        content: $("editContent").value.trim(),
        fix_status: category === "报错" ? $("editFixStatus").value : "",
        fix_note: category === "报错" ? $("editFixNote").value.trim() : "",
        image_url: imageUrl,
        video_url: videoUrl,
        keywords: ""
      };
      const existingItem = state.items.find((item) => String(item.id) === String(id));
      const preservePin = isPinned(existingItem);
      row.keywords = keywordsWithPin([row.title, row.content, row.fix_note].filter(Boolean).join(" "), preservePin);
      if (!row.title || !row.content) {
        $("editError").textContent = "标题和内容都要填写。";
        return;
      }
      if (preservePin && existingItem?.section !== row.section) {
        const targetPinnedCount = state.items.filter((item) =>
          item.section === row.section && isPinned(item) && String(item.id) !== String(id)
        ).length;
        if (targetPinnedCount >= 3) {
          $("editError").textContent = `${row.section}已经置顶3条，请先取消一条置顶再移动。`;
          return;
        }
      }
      const res = await db.rpc("kb_admin_save_item_v2", {
        p_password: state.adminPassword,
        p_id: id || null,
        p_section: row.section,
        p_category: row.category,
        p_title: row.title,
        p_content: row.content,
        p_fix_status: row.fix_status,
        p_fix_note: row.fix_note,
        p_image_url: row.image_url,
        p_video_url: row.video_url,
        p_keywords: row.keywords
      });
      if (res.error) {
        $("editError").textContent = `保存失败：${res.error.message || "请重新登录管理员窗口。"}`;
        return;
      }
      const saved = Array.isArray(res.data) ? res.data[0] : res.data;
      if (saved?.id) {
        state.items = [saved, ...state.items.filter((item) => String(item.id) !== String(saved.id))]
          .sort((a, b) => {
            const timeDiff = new Date(b.created_at || 0) - new Date(a.created_at || 0);
            return timeDiff || String(b.id).localeCompare(String(a.id));
          });
        state.expanded.add(String(saved.id));
        state.knownItemIds.add(String(saved.id));
      }
      closeModal();
      render();
      showToast(id ? "内容已更新" : "内容已发布");
      await loadAll();
    };

    window.togglePinnedItem = async (id, button) => {
      const item = state.items.find((row) => String(row.id) === String(id));
      if (!item || normalizeCategory(item.category) === FEATURE_CATEGORY) return;
      const nextPinned = !isPinned(item);
      if (nextPinned) {
        const pinnedCount = state.items.filter((row) =>
          normalizeCategory(row.category) !== FEATURE_CATEGORY &&
          row.section === item.section &&
          isPinned(row) &&
          String(row.id) !== String(item.id)
        ).length;
        if (pinnedCount >= 3) {
          showToast(`${item.section}最多置顶3条，请先取消一条置顶`);
          return;
        }
      }
      if (button) button.disabled = true;
      const nextKeywords = keywordsWithPin(item.keywords, nextPinned);
      const res = await db.rpc("kb_admin_save_item_v2", {
        p_password: state.adminPassword,
        p_id: item.id,
        p_section: item.section,
        p_category: normalizeCategory(item.category),
        p_title: item.title,
        p_content: item.content,
        p_fix_status: item.fix_status || "",
        p_fix_note: item.fix_note || "",
        p_image_url: item.image_url || "",
        p_video_url: item.video_url || "",
        p_keywords: nextKeywords
      });
      if (res.error) {
        showToast(`置顶操作失败：${res.error.message || "请重新登录管理员窗口"}`);
        if (button) button.disabled = false;
        return;
      }
      const saved = Array.isArray(res.data) ? res.data[0] : res.data;
      const updated = saved?.id ? saved : { ...item, keywords: nextKeywords };
      state.items = state.items.map((row) => String(row.id) === String(id) ? updated : row);
      render();
      showToast(nextPinned ? `已置顶到${item.section}` : "已取消置顶");
      await loadAll();
    };

    window.requestDeleteItem = (id) => {
      const item = state.items.find((row) => String(row.id) === String(id));
      if (!item) return;
      modal(`
        <div class="modal-title">确认删除</div>
        <div class="hint">删除后无法恢复，请确认要删除下面这条内容：</div>
        <div class="status-panel" style="margin-top:12px"><b>${esc(item.title)}</b></div>
        <div id="deleteError" class="error"></div>
        <button id="confirmDeleteBtn" class="primary" style="width:100%;margin-top:18px;background:#9a3b3b" onclick="confirmDeleteItem('${item.id}')">确认删除</button>
      `, true);
    };

    window.confirmDeleteItem = async (id) => {
      const button = $("confirmDeleteBtn");
      button.disabled = true;
      button.textContent = "正在删除…";
      const { error } = await db.rpc("kb_admin_delete_item_v2", { p_password: state.adminPassword, p_id: id });
      if (error) {
        $("deleteError").textContent = `删除失败：${error.message || "请重新登录管理员窗口。"}`;
        button.disabled = false;
        button.textContent = "确认删除";
        return;
      }
      state.items = state.items.filter((item) => String(item.id) !== String(id));
      state.expanded.delete(String(id));
      closeModal();
      render();
      showToast("内容已删除");
      await loadAll();
    };

    function parseImportText(text) {
      return text.split(/\n\s*\n|\n-{3,}\n/).map((b) => b.trim()).filter(Boolean).map((block) => {
        const row = { section: "学生端", category: "报错", title: "", content: "", fix_status: "修复中", fix_note: "", image_url: "", video_url: "", keywords: "", pinned: false };
        for (const raw of block.split("\n")) {
          const line = raw.trim();
          const m = line.match(/^(标题|Q|内容|正文|A|板块|分类|类型|修复状态|状态|状态说明|修复说明|图片|视频|置顶)[:：]\s*(.*)$/i);
          if (!m) {
            if (row.content) row.content += "\n" + line;
            else if (row.title) row.title += "\n" + line;
            continue;
          }
          const key = m[1];
          const value = m[2];
          if (/^(标题|Q)$/i.test(key)) row.title = value;
          else if (/^(内容|正文|A)$/i.test(key)) row.content = value;
          else if (key === "板块") row.section = sections.some((s) => s.key === value) ? value : "学生端";
          else if (key === "分类" || key === "类型") row.category = categories.includes(value) ? value : normalizeCategory(value);
          else if (key === "修复状态" || key === "状态") row.fix_status = normalizeFixStatus(value);
          else if (key === "状态说明" || key === "修复说明") row.fix_note = value;
          else if (key === "图片") row.image_url = value;
          else if (key === "视频") row.video_url = value;
          else if (key === "置顶") row.pinned = /^(是|true|1|yes)$/i.test(value);
        }
        if (isClubSection(row.section)) {
          row.category = "情况说明";
          row.fix_status = "";
          row.fix_note = "";
        }
        row.keywords = keywordsWithPin([row.title, row.content, row.fix_note].filter(Boolean).join(" "), row.pinned);
        delete row.pinned;
        if (row.category === "报错" && normalizeFixStatus(row.fix_status) === "修复中" && !row.fix_note) {
          row.fix_note = DEFAULT_FIXING_NOTE;
        }
        return row;
      }).filter((r) => r.title && r.content);
    }

    window.openImport = () => {
      modal(`
        <div class="modal-title">批量导入内容</div>
        <div class="hint">每条内容用一个空行或 --- 隔开。</div>
        <pre>标题：智慧教室投屏失败怎么办
内容：先检查设备和电视是否在同一网络，其次重启投屏助手App
板块：智慧教室
分类：报错
修复状态：修复中
状态说明：已反馈技术排查，临时处理方式是重启投屏助手App
图片：https://example.com/a.png
视频：https://example.com/demo.mp4
说明：不需要填写关键词，系统会自动从标题、内容和状态说明里匹配。</pre>
        <textarea id="importText" class="field" style="min-height:180px;font-family:monospace" placeholder="把整理好的内容粘贴到这里…"></textarea>
        <div id="importInfo" class="hint" style="margin-top:8px">粘贴后点击导入。</div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="runImport()">导入</button>
      `);
    };

    window.runImport = async () => {
      const rows = parseImportText($("importText").value);
      if (!rows.length) {
        $("importInfo").textContent = "没有识别到内容，请检查格式。";
        return;
      }
      const { error } = await db.rpc("kb_admin_import_items_v2", { p_password: state.adminPassword, p_rows: rows });
      if (error) {
        $("importInfo").textContent = "导入失败，请确认管理密码仍然有效。";
        return;
      }
      closeModal();
      await loadAll();
    };

    window.copyBackup = async () => {
      const text = state.items.map((it) =>
        `标题：${it.title}\n内容：${it.content}\n板块：${it.section}` +
        (normalizeCategory(it.category) ? `\n分类：${normalizeCategory(it.category)}` : "") +
        (normalizeCategory(it.category) === "报错" ? `\n修复状态：${normalizeFixStatus(it.fix_status)}` : "") +
        (normalizeCategory(it.category) === "报错" && it.fix_note ? `\n状态说明：${it.fix_note}` : "") +
        (it.image_url ? `\n图片：${it.image_url}` : "") +
        (it.video_url ? `\n视频：${it.video_url}` : "") +
        (isPinned(it) ? `\n置顶：是` : "")
      ).join("\n\n---\n\n");
      await navigator.clipboard.writeText(text);
      alert("已复制全部备份。");
    };

    window.openInfoEditor = () => {
      const rows = state.info.length ? state.info : [{ label: "当前最新版本号：", value: "" }];
      modal(`
        <div class="modal-title">编辑基础信息</div>
        <div id="infoRows">${rows.map((r) => infoRowHtml(r.label, r.value)).join("")}</div>
        <button class="tag" onclick="addInfoRow()">添加一行</button>
        <div id="infoError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="saveInfo()">保存</button>
      `);
    };
    function infoRowHtml(label = "", value = "") {
      return `<div class="row"><input class="field info-label" value="${esc(label)}" placeholder="标签，如：版本号"><input class="field info-value" value="${esc(value)}" placeholder="内容，如：v1.0.0"><button class="clear" onclick="this.parentElement.remove()">×</button></div>`;
    }
    window.addInfoRow = () => $("infoRows").insertAdjacentHTML("beforeend", infoRowHtml());
    window.saveInfo = async () => {
      const labels = Array.from(document.querySelectorAll(".info-label"));
      const values = Array.from(document.querySelectorAll(".info-value"));
      const rows = labels.map((el, i) => ({ label: el.value.trim(), value: values[i].value.trim(), sort_order: i + 1 })).filter((r) => r.label && r.value);
      const { error } = await db.rpc("kb_admin_replace_basic_info_v2", { p_password: state.adminPassword, p_rows: rows });
      if (error) {
        $("infoError").textContent = `保存失败：${error.message || "请重新登录管理员窗口。"}`;
        return;
      }
      state.info = rows;
      closeModal();
      render();
      showToast("基础信息已保存");
      await loadAll();
    };

    window.openPasswordEditor = () => {
      modal(`
        <div class="modal-title">修改管理密码</div>
        <label>新密码</label>
        <input id="newPw1" class="field" type="password" placeholder="至少4位">
        <label>确认新密码</label>
        <input id="newPw2" class="field" type="password" placeholder="再输入一遍">
        <div id="pwError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="changePassword()">保存新密码</button>
      `, true);
      setTimeout(() => $("newPw1")?.focus(), 50);
    };

    window.changePassword = async () => {
      const pw1 = $("newPw1").value;
      const pw2 = $("newPw2").value;
      if (pw1.length < 4) {
        $("pwError").textContent = "密码至少4位。";
        return;
      }
      if (pw1 !== pw2) {
        $("pwError").textContent = "两次输入的密码不一致。";
        return;
      }
      const { error } = await db.rpc("kb_admin_change_password_v2", {
        p_old_password: state.adminPassword,
        p_new_password: pw1
      });
      if (error) {
        $("pwError").textContent = "修改失败，请确认当前管理状态仍然有效。";
        return;
      }
      state.adminPassword = pw1;
      localStorage.setItem("kb-admin-password", pw1);
      closeModal();
      alert("管理密码已修改。");
    };

    init();
    document.addEventListener("click", (event) => {
      if (state.featureOpen && !event.target.closest("#featureModule") && !event.target.closest("#imageLightbox")) {
        state.featureOpen = false;
        state.featureFocusIndex = null;
        renderFeature();
      }
    });
    $("featureBackdrop").addEventListener("click", () => {
      state.featureOpen = false;
      state.featureFocusIndex = null;
      renderFeature();
    });
  </script>
</body>
</html>
