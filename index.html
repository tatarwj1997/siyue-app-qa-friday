<title>思悦云学习App最新信息查询</title>
<script>
// Compatibility adapter: keep the existing UI and editor unchanged.
window.siyueCloud = {createClient(base, unused, options={}) {
  let pending=null, last=null, expires=0;
  const headers=options.global?.headers||{};

  const valid = data => data && ["kb_items","kb_basic_info","kb_site_meta"].every(key => Array.isArray(data[key]));
  const fetchOne = async (endpoint, path, init, timeout) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(endpoint + path, {...init, signal: controller.signal, headers: {...headers,...init.headers}, cache:"no-store"});
      const data = await response.json();
      if (path === "/data" && data.kb_today_visits) window.showTodayVisits?.(data.kb_today_visits);
      return response.ok ? {data,error:null} : {data:null,error:{message:data.message || "请求失败"}};
    } catch (error) {
      return {data:null,error:{message:error.name === "AbortError" ? "连接超时，请稍后重试" : error.message}};
    } finally { clearTimeout(timer); }
  };
  const request = async (path, init = {}) => {
    // Direct connection to the owner-managed Cloudflare D1/R2 backend.
    if (path !== "/data") {
      // Never retry a write: a timeout may happen after the server saved it.
      return fetchOne(window.siyueActiveEndpoint || base, path, init, 30000);
    }
    const endpoints = [base];
    let result;
    for (const endpoint of endpoints) {
      result = await fetchOne(endpoint, path, init, 15000);
      if (!result.error && valid(result.data)) {
        window.siyueActiveEndpoint = endpoint;
        return result;
      }
    }
    return {data:null,error:result?.error || {message:"暂时无法连接实时内容服务"}};
  };
  const all=()=>{
    if(last&&Date.now()<expires)return Promise.resolve(last);
    if(!pending)pending=request('/data').then(result=>{last=result;expires=Date.now()+200;return result;}).finally(()=>{pending=null;});
    return pending;
  };
  return {
    from(table){
      let single=false;const filters=[];const orders=[];
      const query={
        select(){return query;},
        order(key,options){orders.push([key,options?.ascending!==false]);return query;},
        eq(key,value){filters.push([key,value]);return query;},
        maybeSingle(){single=true;return query;},
        then(resolve,reject){return all().then(result=>{
          if(result.error)return result;
          let rows=[...(result.data[table]||[])].filter(r=>filters.every(([k,v])=>String(r[k])===String(v)));
          rows.sort((a,b)=>{for(const [k,asc] of orders){const diff=typeof a[k]==='number'?a[k]-b[k]:String(a[k]).localeCompare(String(b[k]));if(diff)return asc?diff:-diff;}return 0;});
          return {data:single?(rows[0]||null):rows,error:null};
        }).then(resolve,reject);}
      };return query;
    },
    async rpc(name,params){const result=await request('/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});last=null;expires=0;return result;},
    // Existing ten-second polling, focus and visibility refresh remain active.
    channel(){const channel={on(){return channel;},subscribe(){return channel;}};return channel;},
    storage:{from(){return {
      upload(path,file,opts={}){return request('/media/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':opts.contentType||file.type},body:file});},
      getPublicUrl(path){return {data:{publicUrl:base+'/media/'+path.split('/').map(encodeURIComponent).join('/')}};}
    };}}
  };
}};

</script>

  <script>
    const SUPABASE_URL = "https://siyue-kb-gateway.pages.dev";

    const CLUB_SECTION = "思悦 Club 资源汇总";

    const SITE_TITLE = "思悦云学习App最新信息查询";
    const HEADER_INFO_LABELS = { siteTitle: "网站标题", featureTitle: "上新功能标题", version: "当前最新版本号：" };
    const RICH_CONTENT_PREFIX = "KB_RICH_TEXT_V1:";
    const RICH_FONT_SIZES = [12, 14, 16, 18, 20, 24, 28, 32];
    const FEATURE_DATA_PREFIX = "FEATURE_ITEMS_V1:";
    const FEATURE_DATA_PREFIX_V2 = "FEATURE_DATA_V2:";

    const fixStatuses = ["修复中", "已修复", "后续优化"];
    const fixStatusColors = { 修复中: "#C9A227", 已修复: "#2E7D5A", 后续优化: "#52A882" };
    const DEFAULT_FIXING_NOTE = "修复中，请耐心等待。修复完成会在教学群内通知各位老师。";
    const state = {
      items: [],
      info: [],
      dataRevision: 0,
      lastUpdatedAt: "",
      adminPassword: localStorage.getItem("kb-admin-password") || "",
      isAdmin: false,
      headerDraft: null,

      headerError: "",
      featureSavedId: null,
      featureSaving: false,

    };
    let loadPromise = null;
    let toastTimer = null;
    let liveChannel = null;
    let videoSelectionToken = 0;
    const richEditors = new Map();
    let activeRichEditorId = "editContent";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
    function linkifyText(value) {
      const text = String(value ?? "");
      const pattern = /(?:https?:\/\/|www\.)[^\s<>"'`，。；：！？、【】（）“”‘’《》]+/gi;
      let html = "";
      let cursor = 0;
      for (const match of text.matchAll(pattern)) {
        let label = match[0];
        // Keep sentence punctuation outside links, while retaining balanced URL brackets.
        while (label) {
          const last = label.at(-1);
          const opening = { ")": "(", "]": "[", "}": "{" }[last];
          const unmatchedClose = opening && label.split(last).length > label.split(opening).length;
          if (/[.,;:!?]/.test(last) || unmatchedClose) label = label.slice(0, -1);
          else break;
        }
        html += esc(text.slice(cursor, match.index));
        try {
          const url = new URL(/^www\./i.test(label) ? `https://${label}` : label);
          if (!["http:", "https:"].includes(url.protocol) || !url.hostname) throw new Error("Unsupported URL");
          html += `<a class="body-link" href="${esc(mediaUrl(url.href))}" target="_blank" rel="noopener noreferrer" title="在新标签页打开">${esc(label)}</a>${esc(match[0].slice(label.length))}`;
        } catch {
          html += esc(match[0]);
        }
        cursor = match.index + match[0].length;
      }
      return html + esc(text.slice(cursor));
    }
    function decodeRichContent(value) {
      if (!String(value ?? "").startsWith(RICH_CONTENT_PREFIX)) return null;
      try {
        const data = JSON.parse(String(value).slice(RICH_CONTENT_PREFIX.length));
        return data && typeof data.html === "string" ? data.html : null;
      } catch { return null; }
    }

    function sanitizeRichHtml(html, autoLinks = false) {
      const template = document.createElement("template");
      template.innerHTML = String(html ?? "");
      const allowed = new Set(["p", "div", "br", "strong", "b", "u", "em", "i", "ul", "ol", "li", "h2", "h3", "h4", "span", "font", "a"]);
      const blocked = new Set(["script", "style", "iframe", "object", "embed", "svg", "math", "template", "form", "input", "textarea", "select", "button", "link", "meta", "base", "img", "video", "audio", "source"]);
      const fontMap = { 1: 12, 2: 14, 3: 16, 4: 18, 5: 20, 6: 24, 7: 32 };
      const cleanNode = (node, insideLink = false) => {
        if (node.nodeType === 3) {
          const value = node.textContent || "";
          return (autoLinks && !insideLink ? linkifyText(value) : esc(value)).replace(/\r\n?|\n/g, "<br>");
        }
        if (node.nodeType !== 1) return "";
        let tag = node.tagName.toLowerCase();
        if (blocked.has(tag)) return "";
        let href = "";
        if (tag === "a") {
          try {
            const raw = (node.getAttribute("href") || "").trim();
            const url = new URL(/^www\./i.test(raw) ? `https://${raw}` : raw);
            if (["http:", "https:"].includes(url.protocol) && url.hostname) href = url.href;
          } catch {}
        }
        const children = Array.from(node.childNodes).map((child) => cleanNode(child, insideLink || Boolean(href))).join("");
        if (!allowed.has(tag)) return children;
        if (tag === "a") return href && !insideLink ? `<a class="body-link" href="${esc(mediaUrl(href))}" target="_blank" rel="noopener noreferrer">${children}</a>` : children;
        if (tag === "br") return "<br>";
        const styles = [];
        const cssSize = node.style.fontSize;
        const size = /^\d+px$/.test(cssSize) ? Number.parseInt(cssSize, 10) : (tag === "font" ? fontMap[node.getAttribute("size")] : null);
        if (RICH_FONT_SIZES.includes(size)) styles.push(`font-size:${size}px`);
        if (["bold", "bolder"].includes(node.style.fontWeight) || Number(node.style.fontWeight) >= 600) styles.push("font-weight:bold");
        else if (node.style.fontWeight === "normal" || node.style.fontWeight === "400") styles.push("font-weight:normal");
        if ((node.style.textDecorationLine || node.style.textDecoration).split(/\s+/).includes("underline")) styles.push("text-decoration:underline");
        tag = ({ b: "strong", i: "em", font: "span" })[tag] || tag;
        if (tag === "span" && !styles.length) return children;
        return `<${tag}${styles.length ? ` style="${styles.join(";")}"` : ""}>${children}</${tag}>`;
      };
      return Array.from(template.content.childNodes).map((node) => cleanNode(node)).join("");
    }

    function bodyContentText(value) {
      const html = decodeRichContent(value);
      if (html === null) return String(value ?? "");
      const template = document.createElement("template");
      template.innerHTML = sanitizeRichHtml(html);
      const readNode = (node) => {
        if (node.nodeType === 3) return node.textContent;
        const tag = node.nodeType === 1 ? node.tagName.toLowerCase() : "";
        if (tag === "br") return "\n";
        const text = Array.from(node.childNodes).map(readNode).join("");
        return text + (/^(p|div|li|ul|ol|h[234])$/.test(tag) ? "\n" : "");
      };
      return readNode(template.content).trim();
    }

    function encodeRichContent(html) {
      const encoded = RICH_CONTENT_PREFIX + JSON.stringify({ html: sanitizeRichHtml(html) });
      return bodyContentText(encoded) ? encoded : "";
    }

    function normalizeBodyContent(value) {
      const html = decodeRichContent(value);
      return html === null ? String(value ?? "") : encodeRichContent(html);
    }

    function renderBodyContent(value) {
      const html = decodeRichContent(value);
      return html === null ? linkifyText(value) : `<div class="rich-text">${sanitizeRichHtml(html, true)}</div>`;
    }

    function richEditorMarkup(editorId = "editContent") {
      return `<div class="rich-toolbar" role="toolbar" aria-label="正文排版">
        <select aria-label="段落样式" data-rich-style="block"><option value="" selected disabled>段落</option><option value="p">正文</option><option value="h2">一级标题</option><option value="h3">二级标题</option><option value="h4">三级标题</option></select>
        <select aria-label="字体大小" data-rich-style="size"><option value="" selected disabled>字号</option>${RICH_FONT_SIZES.map((size) => `<option value="${size}">${size} px</option>`).join("")}</select>
        <button type="button" data-rich-command="bold" aria-label="加粗" aria-pressed="false"><b>加粗</b></button>
        <button type="button" data-rich-command="underline" aria-label="下划线" aria-pressed="false"><u>下划线</u></button>
        <button type="button" data-rich-command="insertOrderedList" aria-label="编号列表" aria-pressed="false">1. 序号</button>
        <button type="button" data-rich-command="insertUnorderedList" aria-label="圆点列表" aria-pressed="false">• 圆点</button>
      </div><div id="${esc(editorId)}" class="field rich-editor rich-text" data-rich-editor contenteditable="true" role="textbox" aria-label="正文内容" aria-multiline="true" data-placeholder="写清楚具体的操作步骤"></div>`;
    }

    function richSelectionIsValid(range, editor) {
      return range && editor && editor.contains(range.startContainer) && editor.contains(range.endContainer);
    }

    window.rememberRichSelection = () => {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const anchor = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      const editor = anchor?.closest("[data-rich-editor]");
      if (!richSelectionIsValid(range, editor)) return;
      const record = richEditors.get(editor.id);
      if (!record) return;
      activeRichEditorId = editor.id;
      record.selection = range.cloneRange();
      editor.previousElementSibling.querySelectorAll("[data-rich-command]").forEach((button) => {
        button.setAttribute("aria-pressed", String(document.queryCommandState(button.dataset.richCommand)));
      });
    };

    function restoreRichSelection(editorId = activeRichEditorId) {
      const editor = $(editorId);
      if (!editor) return null;
      const remembered = richEditors.get(editorId)?.selection?.cloneRange();
      editor.focus();
      const selection = window.getSelection();
      const range = richSelectionIsValid(remembered, editor) ? remembered : document.createRange();
      if (!richSelectionIsValid(range, editor)) { range.selectNodeContents(editor); range.collapse(false); }
      selection.removeAllRanges();
      selection.addRange(range);
      return editor;
    }

    window.applyRichFormat = (command, value, editorId = activeRichEditorId) => {
      if (!state.isAdmin) return;
      rememberRichSelection();
      const editor = restoreRichSelection(editorId);
      if (!editor) return;
      const selection = window.getSelection();
      const selectedRange = selection.getRangeAt(0);
      const beforeText = editor.textContent;
      const textOffset = (container, offset) => {
        const prefix = document.createRange();
        prefix.selectNodeContents(editor);
        prefix.setEnd(container, offset);
        return prefix.toString().length;
      };
      const bookmark = { start: textOffset(selectedRange.startContainer, selectedRange.startOffset), end: textOffset(selectedRange.endContainer, selectedRange.endOffset) };
      document.execCommand("styleWithCSS", false, false);
      if (command === "block" && ["p", "h2", "h3", "h4"].includes(value)) {
        document.execCommand("formatBlock", false, value);
      } else if (command === "size" && RICH_FONT_SIZES.includes(Number(value))) {
        document.execCommand("fontSize", false, "7");
        editor.querySelectorAll('font[size="7"]').forEach((font) => {
          font.style.fontSize = `${Number(value)}px`;
          font.removeAttribute("size");
        });
      } else if (["bold", "underline", "insertOrderedList", "insertUnorderedList"].includes(command)) {
        document.execCommand(command, false);
      }
      // List commands can move the caret to the beginning of the new list item.
      if (["insertOrderedList", "insertUnorderedList"].includes(command) && beforeText && editor.textContent === beforeText) {
        const locate = (offset) => {
          const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
          let node;
          let remaining = offset;
          while ((node = walker.nextNode())) {
            if (remaining <= node.textContent.length) return [node, remaining];
            remaining -= node.textContent.length;
          }
          return [editor, editor.childNodes.length];
        };
        const range = document.createRange();
        range.setStart(...locate(bookmark.start));
        range.setEnd(...locate(bookmark.end));
        selection.removeAllRanges();
        selection.addRange(range);
      }
      rememberRichSelection();
      richEditors.get(editor.id)?.onChange?.(editedBodyContent(editor.id));
    };

    function setupRichEditor(content, editorId = "editContent", onChange = null) {
      const editor = $(editorId);
      const html = decodeRichContent(content);
      editor.innerHTML = html === null ? esc(content).replace(/\r\n?|\n/g, "<br>") : sanitizeRichHtml(html);
      richEditors.set(editorId, { originalContent: String(content ?? ""), initialHtml: editor.innerHTML, selection: null, onChange });
      const toolbar = editor.previousElementSibling;
      toolbar.querySelectorAll("button, select").forEach((control) => {
        control.onpointerdown = (event) => { rememberRichSelection(); if (control.tagName === "BUTTON") event.preventDefault(); };
        if (control.tagName === "BUTTON") control.onclick = () => applyRichFormat(control.dataset.richCommand, null, editorId);
        else control.onchange = () => { applyRichFormat(control.dataset.richStyle, control.value, editorId); control.value = ""; };
      });
      const insertTransfer = (transfer) => {
        const html = transfer?.getData("text/html");
        const text = transfer?.getData("text/plain") || "";
        const safe = html ? sanitizeRichHtml(html) : esc(text).replace(/\r\n?|\n/g, "<br>");
        if (safe) document.execCommand("insertHTML", false, safe);
        rememberRichSelection();
        onChange?.(editedBodyContent(editorId));
      };
      editor.addEventListener("paste", (event) => { event.preventDefault(); insertTransfer(event.clipboardData); });
      editor.addEventListener("drop", (event) => {
        event.preventDefault();
        const range = document.caretRangeFromPoint?.(event.clientX, event.clientY);
        if (richSelectionIsValid(range, editor)) { richEditors.get(editorId).selection = range; restoreRichSelection(editorId); }
        insertTransfer(event.dataTransfer);
      });
      editor.addEventListener("input", () => { rememberRichSelection(); onChange?.(editedBodyContent(editorId)); });
      editor.addEventListener("keyup", rememberRichSelection);
      editor.addEventListener("mouseup", rememberRichSelection);
    }

    function editedBodyContent(editorId = "editContent") {
      const editor = $(editorId);
      const record = richEditors.get(editorId);
      return editor.innerHTML === record?.initialHtml ? record.originalContent : encodeRichContent(editor.innerHTML);
    }
    document.addEventListener("selectionchange", rememberRichSelection);

    const colorForCategory = (c) => categoryColors[c] || "#6B6558";
    const colorForSection = (s) => sections.find((x) => x.key === s)?.color || "#6B6558";
    const colorForFixStatus = (s) => fixStatusColors[s] || "#6B8C7A";
    const normalizeCategory = (c) => c === "更新" || c === "优化" ? "优化更新" : (c || "");
    const normalizeFixStatus = (s) => fixStatuses.includes(s) ? s : "修复中";
    const isVideoUrl = (u) => /\.(mp4|webm|mov|m4v|ogv|ogg)(\?.*)?$/i.test(u || "");
    const dateText = (d) => d ? new Date(d).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" }) : "—";
    const yearMonthText = (value) => {
      if (!value) return "暂无记录";
      const d = new Date(value);
      return `${d.getFullYear()}年${d.getMonth() + 1}月`;
    };
    const dateTimeText = (value) => {
      if (!value) return "暂无记录";
      const d = new Date(value);
      const pad = (number) => String(number).padStart(2, "0");
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const safeFileName = (name) => name.replace(/[^\w.\-]+/g, "_").slice(-90);
    const formatVideoDuration = (seconds) => {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    };
    const clearPendingVideoFile = () => {
      if (state.pendingVideoFile?.previewUrl) URL.revokeObjectURL(state.pendingVideoFile.previewUrl);
      state.pendingVideoFile = null;
      const input = $("editVideoFile");
      if (input) input.value = "";
    };
    const readVideoDuration = (file) => new Promise((resolve, reject) => {
      const objectUrl = URL.createObjectURL(file);

        dialog=document.createElement('dialog');dialog.id='exam-summary-dialog';
        dialog.setAttribute('aria-labelledby','exam-summary-title');
        dialog.innerHTML='<header><div><h2 id="exam-summary-title">10月9日云学习小测内容巩固</h2><small>10月10日 09:30 自动关闭（北京时间）</small></div><button type="button" aria-label="关闭汇总窗口">关闭</button></header><div class="exam-copy"><p>以下汇总引用网站已有内容。点击标题展开查看。</p><div id="exam-summary-items"></div></div>';
        dialog.querySelector('button').onclick=()=>dialog.close();
        document.body.appendChild(dialog);
        const entry=document.createElement('button');entry.id='exam-summary-entry';entry.textContent='10月9日云学习小测内容巩固';entry.onclick=()=>{if(Date.now()<EXAM_SUMMARY_END)dialog.showModal();else syncExamSummary();};document.body.appendChild(entry);
      }
      const entries=EXAM_SUMMARY_REFS.map(ref=>({ref,item:state.items.find(item=>String(item.id)===ref.id)}));
      const signature=JSON.stringify(entries.map(e=>e.item));
      if(signature!==examSummarySignature){
        examSummarySignature=signature;
        document.getElementById('exam-summary-items').innerHTML=entries.map(({ref,item},i)=>'<details><summary>'+esc((i+1)+'. '+(item?.title||ref.title))+'</summary><div class="exam-body">'+(item?(renderBodyContent(item.content)+(item.image_url?'<p><img src="'+esc(mediaUrl(item.image_url))+'" alt="'+esc(item.title)+'" loading="lazy"></p>':'')):'该条内容暂不可用，请在网站中查询。')+'</div></details>').join('');
      }
      if(!examSummaryShown){examSummaryShown=true;dialog.showModal();}
    }
    window.setInterval(syncExamSummary,1000);
    window.addEventListener('focus',syncExamSummary);
    document.addEventListener('visibilitychange',syncExamSummary);

    function render() {
      syncExamSummary();
      renderHeader();
      renderFeature();
      renderFilters();
      renderAdminTools();
      renderList();
    }

    function mergedFeatureItem(items) {
      if (items.length === 1) return {...items[0], extra_images: items[0].extra_images || []};
      const html = items.map(item => [
        item.title ? `<h3>${esc(item.title)}</h3>` : "",
        item.subtitle ? `<p>${esc(item.subtitle)}</p>` : "",
        decodeRichContent(item.content) ?? `<p>${esc(item.content).replace(/\n/g,"<br>")}</p>`
      ].join("")).join("");
      const images = items.flatMap(item => [item.image_url, ...(item.extra_images || [])]).filter(Boolean);
      return {...emptyFeatureItem(),title:"",subtitle:"",content:html ? encodeRichContent(html) : "",image_url:images[0] || "",extra_images:images.slice(1)};
    }

    function featureDetail(feature, archived = false) {
      const {posters, items, otherContent, version} = parseFeatureData(feature);
      const displayVersion=archived ? version : sharedVersion();
      const merged = mergedFeatureItem(items);
      const picture = (url, label) => `<div class="feature-poster-wrap"><button class="feature-poster-button" data-url="${esc(mediaUrl(url))}" data-alt="${esc(label)}" onclick="openImagePreview(this.dataset.url,this.dataset.alt)"><img class="feature-poster" src="${esc(mediaUrl(url))}" alt="${esc(label)}" loading="lazy" decoding="async"></button><button class="image-download" data-url="${esc(mediaUrl(url))}" data-name="${esc(label)}" onclick="downloadOriginalImage(event,this.dataset.url,this.dataset.name)">下载原图</button></div>`;
      const idArg = feature ? esc(JSON.stringify(String(feature.id))) : "null";
      return `<article class="feature-panel student${archived ? " archived-release" : ""}">
        <h2 class="feature-panel-title">${archived ? "往期更新内容" : "思悦云学习 App 最新更新内容"}${displayVersion ? `<span>版本 ${esc(displayVersion)}</span>` : archived ? `<span>版本未记录</span>` : ""}</h2>
        ${state.isAdmin ? `<div class="feature-actions" style="margin:0 0 18px"><button class="primary" onclick="openFeatureEditor(false,${archived ? idArg : 'null'})">编辑</button>${!archived ? `<button class="primary gray" onclick="requestArchiveFeatureItems()" ${!feature ? 'disabled' : ''}>一键转</button>` : ""}</div>` : ""}
        <div class="feature-release-body${posters.length ? " has-poster" : ""}">
        ${posters.length ? `<section class="feature-poster-section"><div class="feature-section-heading"><span>功能海报</span><small>${posters.length} 张</small></div><div class="feature-poster-grid">${posters.map((p,i)=>picture(p.image_url,`功能海报 ${i+1}`)).join("")}</div></section>` : ""}
        <div class="feature-release-copy"><section class="feature-update-section"><div class="feature-section-heading"><span>外宣更新内容</span></div>
          ${items.length ? `<article id="feature-update-0" class="feature-update-card">${merged.title ? `<h3 class="feature-update-title">${esc(merged.title)}</h3>` : ""}${merged.subtitle ? `<div class="feature-update-subtitle">${linkifyText(merged.subtitle)}</div>` : ""}<div class="feature-update-content">${renderBodyContent(merged.content)}</div>${[merged.image_url,...(merged.extra_images || [])].filter(Boolean).length ? `<div class="feature-poster-grid">${[merged.image_url,...(merged.extra_images || [])].filter(Boolean).map((u,i)=>picture(u,`更新图片 ${i+1}`)).join("")}</div>` : ""}</article>` : `<div class="feature-copy">暂无本次上新内容。</div>`}
        </section>${bodyContentText(otherContent).trim() ? `<section class="feature-other-section"><div class="feature-section-heading"><span>其他更新</span><small class="internal-update-label">仅供内部知晓</small></div><p class="feature-internal-note">以下功能已同步更新，仅供老师内部知晓，不用于对外宣传，请老师留意相关变更。</p><div class="feature-update-content">${renderBodyContent(otherContent)}</div></section>` : ""}</div></div></article>`;
    }

    function renderFeature() {
      const open = state.featureOpen && !state.featureEditing;
      document.body.classList.toggle("feature-view-open",open);
      $("featureModule").hidden = state.featureEditing;
      $("featureModule").className = `feature-module${open ? " open" : ""}`;
      $("featureBackdrop").className = `feature-backdrop${open ? " show" : ""}`;
      $("featureBackdrop").setAttribute("aria-hidden",String(!open));
      if (state.featureEditing) return;
      if (state.isAdmin && $("featureModule").contains(document.activeElement) && document.activeElement.matches("[data-header-field]")) return;
      const current = state.items.find(i=>i.category === FEATURE_CATEGORY);
      const unseen = hasUnseenFeature(current);
      const archives = state.items.filter(i=>i.category === ARCHIVE_CATEGORY).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
      $("featureModule").innerHTML = `<div class="feature-split">
        <div class="feature-toggle"><button id="featureToggle" class="feature-hit-target" aria-expanded="${open && state.featureTab==='current'}" aria-label="思悦云学习 App 最新更新内容"></button><span class="feature-title">思悦云学习 App 最新更新内容${unseen ? `<small class="update-dot">有新更新</small>` : ""}</span>${sharedVersion() || state.isAdmin ? `<span class="feature-meta"><span class="feature-version-badge"><span class="feature-version-label">最新版本号</span><span id="featureHeaderVersion" data-header-field="version">${esc(sharedVersion())}</span></span><span class="feature-update-date">更新日期 ${esc(current?.updated_at ? new Date(current.updated_at).toLocaleDateString("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}) : "—")}</span></span>` : ""}<span class="feature-arrow">⌄</span></div>
        <div class="feature-toggle"><button id="featureArchiveToggle" class="feature-hit-target" aria-expanded="${open && state.featureTab==='archive'}" aria-label="往期更新"></button><span class="feature-title">往期更新</span><span class="feature-arrow">⌄</span></div>
        </div>${open ? `<div class="feature-detail">${state.featureTab==='current' ? featureDetail(current) : archives.length ? archives.map(a=>`<details class="feature-history" ${String(state.featureArchiveFocus)===String(a.id) ? 'open' : ''}><summary>版本 ${esc(parseFeatureData(a).version || "未记录")} · ${esc((parseFeatureData(a).releaseDate || a.updated_at || a.created_at || '').slice(0,10))}</summary>${featureDetail(a,true)}</details>`).join("") : '<div class="feature-copy">暂无往期更新内容。</div>'}</div>` : ""}`;
      syncHeaderFields();
      for (const [id,tab] of [["featureToggle","current"],["featureArchiveToggle","archive"]]) $(id).onclick = event => {
        event.stopPropagation(); state.featureOpen = !(state.featureOpen && state.featureTab===tab);state.featureTab=tab;if(tab==="current" && state.featureOpen) markFeatureSeen();state.featureFocusIndex=null;renderFeature();
      };
    }

    window.openFeatureSearchResult = (index, event, archiveId = null) => {
      event?.stopPropagation();
      state.featureTab = archiveId ? "archive" : "current";
      state.featureArchiveFocus=archiveId;
      if(!archiveId) markFeatureSeen();
      state.featureFocusIndex = 0;
      state.featureOpen = true;
      renderFeature();
    };

    window.requestArchiveFeatureItems = () => {
      if (!state.isAdmin || state.featureSaving) return;
      const feature=state.items.find(i=>i.category===FEATURE_CATEGORY);
      if (!feature) return showToast("当前没有可转入的上新内容");
      state.featureOpen=false;renderFeature();
      modal(`<div class="modal-title">转入往期更新</div><div class="hint">本次上新的全部正文、排版和图片将整体移入“往期更新”，不再生成学生端情况说明。转入后本次上新位置留空；往期记录会保留当前版本号及对应的全部内容。</div><div id="archiveFeatureError" class="error"></div><button class="primary" style="margin-top:18px" onclick="archiveFeatureItems(event)">确认转入往期更新</button>`,true);
    };
    window.archiveFeatureItems = async event => {
      if (!state.isAdmin || state.featureSaving) return;
      const feature=state.items.find(i=>i.category===FEATURE_CATEGORY);
      if (!feature) return;
      const archivedData=parseFeatureData(feature);
      const archivedContent=FEATURE_DATA_PREFIX_V2+JSON.stringify({version:sharedVersion() || archivedData.version,posters:archivedData.posters.map(p=>p.image_url),items:archivedData.items,other_content:archivedData.otherContent,release_date:archivedData.releaseDate || feature.updated_at || feature.created_at});
      state.featureSaving=true;
      const release=lockModalForSave();
      try {
        const result=await db.rpc("kb_admin_save_item_v2",{
          p_password:state.adminPassword,p_id:feature.id,p_section:"学生端",p_category:ARCHIVE_CATEGORY,
          p_title:"往期更新内容",p_content:archivedContent,p_image_url:feature.image_url || "",p_video_url:feature.video_url || "",
          p_fix_status:feature.fix_status || "",p_fix_note:feature.fix_note || "",p_keywords:feature.keywords || ""
        });
        if (result.error) throw result.error;
        const saved=Array.isArray(result.data)?result.data[0]:result.data;
        if (!saved?.id) throw new Error("未收到保存结果，请刷新后核对");
        state.dataRevision=(state.dataRevision || 0)+1;
        state.items=state.items.map(i=>String(i.id)===String(saved.id)?saved:i);
        state.featureSaving=false;closeModal();state.featureTab="archive";state.featureOpen=true;state.featureArchiveFocus=saved.id;render();
        showToast("已转入往期更新");await loadAll();
      } catch(error) { $("archiveFeatureError").textContent=`转入失败：${error.message || "请稍后重试"}`; }
      finally {state.featureSaving=false;release();}
    };

    window.openFeatureEditor = (resetForNewVersion = false, archiveId = null) => {
      if (!state.isAdmin) return;
      state.featureArchiveId = archiveId;
      state.featureOpen = false;
      state.featureFocusIndex = null;
      state.featureEditing = true;
      renderFeature();
      for (const entry of state.pendingImageFiles) URL.revokeObjectURL(entry.previewUrl);
      state.pendingImageFiles = [];
      const it = state.items.find((item) => archiveId ? String(item.id) === String(archiveId) && item.category === ARCHIVE_CATEGORY : item.category === FEATURE_CATEGORY) || {
        section: "学生端", category: FEATURE_CATEGORY, title: "", content: "", fix_status: "修复中", fix_note: "", image_url: "", video_url: "", keywords: ""
      };
      const draft = resetForNewVersion
        ? { version: "", posters: [], items: [emptyFeatureItem()] }
        : parseFeatureData(it.id ? it : null, true);
      state.featureDraftVersion = archiveId ? draft.version : resetForNewVersion ? "" : sharedVersion();
      state.featureSavedId = it.id || null;
      state.featureDraftPosters = draft.posters;
      state.featureDraftItems = [mergedFeatureItem(draft.items)];
      state.featureDraftOther = draft.otherContent || "";
      state.featureDraftReleaseDate = draft.releaseDate || (archiveId ? it.updated_at || it.created_at : "");
      modal(`
        <div class="modal-title">${archiveId ? "编辑往期更新" : "编辑本次上新"}</div>
        <div class="hint">分为“外宣更新内容”和“其他更新”，均支持富文本排版。“其他更新”留空时不会展示。</div>
        ${!archiveId ? `<label>本次上新版本号</label><input id="featureVersion" class="field" value="${esc(state.featureDraftVersion)}" oninput="state.featureDraftVersion = this.value">` : ""}
        <section class="feature-poster-editor">
          <div class="feature-edit-head"><span>顶部海报</span><span id="featurePosterCount"></span></div>
          <label>海报图片（最多3张，可分多次选择）</label>
          <input id="featurePosterFiles" class="field" type="file" accept="image/*" multiple onchange="selectFeaturePosters(this)">
          <div id="featurePosterEditList"></div>
        </section>
        <div id="featureEditList" class="feature-edit-list"></div>

        <div id="editError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="saveFeatureItems(event, '${it.id || ""}')">保存</button>
      `, false, "feature-editor-modal");
      renderFeatureEditor();
    };

    function renderFeatureEditor() {
      const posterCount = state.featureDraftPosters.length;
      $("featurePosterCount").textContent = `${posterCount}/3 张`;
      const posterInput = $("featurePosterFiles");
      posterInput.disabled = posterCount >= 3;
      posterInput.value = "";
      $("featurePosterEditList").innerHTML = posterCount ? `<div class="feature-poster-edit-grid">${state.featureDraftPosters.map((poster, index) => {
        const preview = poster.previewUrl || poster.image_url;
        return `<div class="feature-poster-edit-item"><img src="${esc(mediaUrl(preview))}" alt="海报${index + 1}"><button title="移除海报" onclick="removeFeaturePoster(${index})">×</button></div>`;
      }).join("")}</div>` : `<div class="hint" style="margin-top:8px">尚未选择海报。海报会显示在更新事项之前。</div>`;
      $("featureEditList").innerHTML = state.featureDraftItems.map((item, index) => {
        const preview = item.previewUrl || item.image_url;
        return `
          <section class="feature-edit-card">
            <div class="feature-edit-head"><span>外宣更新内容</span></div>
            <label>主标题（选填）</label>
            <input class="field" value="${esc(item.title)}" placeholder="例如：积分商城全新上线" oninput="updateFeatureItem(${index}, 'title', this.value)">
            <label>副标题（选填，不填写则不显示）</label>
            <input class="field" value="${esc(item.subtitle)}" placeholder="例如：积分可兑换更多学习奖励" oninput="updateFeatureItem(${index}, 'subtitle', this.value)">
            <label for="featureContent${index}">正文内容</label>
            ${richEditorMarkup(`featureContent${index}`)}
            <label>图片（限1张）</label>
            <input class="field" type="file" accept="image/*" onchange="selectFeatureItemImage(${index}, this)">
            ${preview ? `<div class="feature-edit-image-preview"><img src="${esc(mediaUrl(preview))}" alt="更新事项${index + 1}图片"><button title="移除图片" onclick="removeFeatureItemImage(${index})">×</button></div>` : `<div class="hint" style="margin-top:6px">尚未选择图片</div>`}
          </section>`;
      }).join("");
      $("featureEditList").insertAdjacentHTML("beforeend", `<section class="feature-edit-card"><div class="feature-edit-head"><span>其他更新（选填）</span><small class="internal-update-label">仅供内部知晓</small></div><p class="feature-internal-note">以下功能已同步更新，仅供老师内部知晓，不用于对外宣传，请老师留意相关变更。</p><label for="featureOtherContent">其他更新内容（留空不显示）</label>${richEditorMarkup("featureOtherContent")}</section>`);
      setupRichEditor(state.featureDraftOther, "featureOtherContent", content => {state.featureDraftOther=content;});
      state.featureDraftItems.forEach((item, index) => setupRichEditor(item.content, `featureContent${index}`, (content) => { item.content = content; }));
    }

    window.selectFeaturePosters = (input) => {
      const files = Array.from(input.files || []);
      const remaining = Math.max(0, 3 - state.featureDraftPosters.length);
      if (!remaining) {
        showToast("海报最多上传3张");
        input.value = "";
        return;
      }
      if (files.length > remaining) showToast(`海报最多3张，本次已添加前${remaining}张`);
      state.featureDraftPosters.push(...files.slice(0, remaining).map((file) => ({
        image_url: "",
        file,
        previewUrl: URL.createObjectURL(file)
      })));
      renderFeatureEditor();
    };

    window.removeFeaturePoster = (index) => {
      const [removed] = state.featureDraftPosters.splice(index, 1);
      if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
      renderFeatureEditor();
    };

    window.updateFeatureItem = (index, field, value) => {
      if (state.featureDraftItems[index] && ["title", "subtitle", "content"].includes(field)) state.featureDraftItems[index][field] = value;
    };

    window.addFeatureItem = () => {
      state.featureDraftItems.push(emptyFeatureItem());
      renderFeatureEditor();
      $("featureEditList").lastElementChild?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };

    window.removeFeatureItem = (index) => {
      const [removed] = state.featureDraftItems.splice(index, 1);
      if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
      if (!state.featureDraftItems.length) state.featureDraftItems.push(emptyFeatureItem());
      renderFeatureEditor();
    };

    window.selectFeatureItemImage = (index, input) => {
      const file = input.files?.[0];
      const item = state.featureDraftItems[index];
      if (!file || !item) return;
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      item.file = file;
      item.previewUrl = URL.createObjectURL(file);
      renderFeatureEditor();
    };

    window.removeFeatureItemImage = (index) => {
      const item = state.featureDraftItems[index];
      if (!item) return;
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      item.file = null;
      item.previewUrl = "";
      item.image_url = "";
      renderFeatureEditor();
    };

    async function uploadFeatureAsset(entry, label) {
      if (!entry.file) return entry.image_url || "";
      const path = `images/${Date.now()}-${label}-${Math.random().toString(36).slice(2, 8)}-${safeFileName(entry.file.name)}`;
      const adminDb = window.siyueCloud.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: { headers: { "x-kb-admin-password": state.adminPassword } }
      });
      const { error } = await adminDb.storage.from("kb-media").upload(path, entry.file, {
        cacheControl: "3600",
        upsert: false,
        contentType: entry.file.type || undefined
      });
      if (error) throw error;
      return db.storage.from("kb-media").getPublicUrl(path).data.publicUrl;
    }

    const uploadFeaturePoster = (poster, index) => uploadFeatureAsset(poster, `poster-${index + 1}`);
    const uploadFeatureItemImage = (item, index) => uploadFeatureAsset(item, `item-${index + 1}`);

    window.saveFeatureItems = async (event, id) => {
      if (state.featureSaving) return;
      state.featureSaving = true;
      const releaseControls = lockModalForSave();
      const button = event?.currentTarget;
      if (button) button.disabled = true;
      let contentSaved = false;
      try {
        $("editError").textContent = "正在上传海报和图片并保存…";
        if (state.featureDraftPosters.length > 3) throw new Error("海报最多上传3张。");
        const savedVersion = state.featureDraftVersion.trim();
        if (!state.featureArchiveId && !savedVersion) throw new Error("请填写本次上新版本号。");
        const meaningfulItems = state.featureDraftItems.filter((item) =>
          item.title.trim() || item.subtitle.trim() || bodyContentText(item.content).trim() || item.image_url || item.file
        );
        if (!meaningfulItems.length && !bodyContentText(state.featureDraftOther).trim()) throw new Error("请至少填写一部分更新内容。");
        const savedPosterUrls = [];
        for (let index = 0; index < state.featureDraftPosters.length; index += 1) {
          const poster = state.featureDraftPosters[index];
          const url = await uploadFeaturePoster(poster, index);
          if (url) {
            savedPosterUrls.push(url);
            poster.image_url = url;
            poster.file = null;
          }
        }
        const savedItems = [];
        for (let index = 0; index < meaningfulItems.length; index += 1) {
          const item = meaningfulItems[index];
          if (!bodyContentText(item.content).trim()) throw new Error("请填写本次更新内容。");
          const imageUrl = await uploadFeatureItemImage(item, index);
          item.image_url = imageUrl;
          item.file = null;
          savedItems.push({
            title: item.title.trim(),
            subtitle: item.subtitle.trim(),
            content: normalizeBodyContent(item.content),
            image_url: imageUrl,
            extra_images: item.extra_images || []
          });
        }
        const encodedContent = FEATURE_DATA_PREFIX_V2 + JSON.stringify({ version: savedVersion, posters: savedPosterUrls, items: savedItems, other_content: bodyContentText(state.featureDraftOther).trim() ? normalizeBodyContent(state.featureDraftOther) : "", release_date: state.featureArchiveId ? state.featureDraftReleaseDate : "" });
        const res = await db.rpc("kb_admin_save_item_v2", {
          p_password: state.adminPassword,
          p_id: state.featureSavedId || id || null,
          p_section: "学生端",
          p_category: state.featureArchiveId ? ARCHIVE_CATEGORY : FEATURE_CATEGORY,
          p_title: state.featureArchiveId ? "往期更新内容" : featureModuleTitle(),
          p_content: encodedContent,
          p_fix_status: "修复中",
          p_fix_note: "",
          p_image_url: [...savedPosterUrls, ...savedItems.flatMap((item) => [item.image_url, ...(item.extra_images || [])]).filter(Boolean)].join("\n"),
          p_video_url: "",
          p_keywords: [savedVersion, ...savedItems.flatMap((item) => [item.title, item.subtitle, bodyContentText(item.content)])].filter(Boolean).join(" ")
        });
        if (res.error) throw res.error;
        const saved = Array.isArray(res.data) ? res.data[0] : res.data;
        if (saved?.id) {
          state.featureSavedId = saved.id;
          state.dataRevision = (state.dataRevision || 0) + 1;
          state.items = [saved, ...state.items.filter((item) => String(item.id) !== String(saved.id))];
        }
        contentSaved = true;
        if (!state.featureArchiveId) await persistHeaderEdits({ version: savedVersion });
        state.featureSaving = false;
        closeModal();
        state.featureTab = state.featureArchiveId ? "archive" : "current";
        state.featureArchiveFocus = state.featureArchiveId;
        state.featureOpen = true;
        render();
        showToast("更新内容已保存");
        await loadAll();
      } catch (error) {
        $("editError").textContent = `${contentSaved ? "海报和更新事项已保存，标题与版本同步失败，请重试保存" : "保存失败"}：${error.message || "请重新登录管理员窗口。"}`;
        if (button) button.disabled = false;
      } finally {
        state.featureSaving = false;
        releaseControls();
      }
    };

    function savedHeaderValues(rows = state.info) {
      const feature = state.items.find((item) => normalizeCategory(item.category) === FEATURE_CATEGORY);
      return {
        siteTitle: rows.find((row) => row.label === HEADER_INFO_LABELS.siteTitle)?.value || SITE_TITLE,
        featureTitle: rows.find((row) => row.label === HEADER_INFO_LABELS.featureTitle)?.value || FEATURE_MODULE_TITLE,
        version: rows.find((row) => /版本/.test(row.label || ""))?.value || parseFeatureData(feature).version || ""
      };
    }

    function refreshHeaderDraft() {
      if (!state.isAdmin) return;
      const saved = savedHeaderValues();
      if (!state.headerDraft) {
        state.headerDraft = { ...saved };
        state.headerBaseline = { ...saved };
        return;
      }
      for (const key of Object.keys(HEADER_INFO_LABELS)) {
        if (state.headerDraft[key] === state.headerBaseline[key]) {
          state.headerDraft[key] = saved[key];
          state.headerBaseline[key] = saved[key];
        }
      }
    }

    function headerValues() {
      return state.isAdmin && state.headerDraft ? state.headerDraft : savedHeaderValues();
    }

    function sharedVersion() { return headerValues().version; }
    function featureModuleTitle() { return headerValues().featureTitle; }

    function syncHeaderFields() {
      const values = headerValues();
      document.querySelectorAll("[data-header-field]").forEach((node) => {
        const key = node.dataset.headerField;
        if (document.activeElement !== node) node.textContent = values[key] || (key === "version" && !state.isAdmin ? "未填写" : "");
        node.contentEditable = state.isAdmin && !state.headerSaving ? "plaintext-only" : "false";
        if (state.isAdmin) {
          node.setAttribute("role", "textbox");
          node.setAttribute("aria-label", ({ siteTitle: "网站标题", featureTitle: "上新功能标题", version: node.id === "headerVersion" ? "顶部版本号" : "上新功能版本号" })[key]);
          node.setAttribute("aria-multiline", "false");
          node.tabIndex = 0;
        } else {
          node.removeAttribute("role");
          node.removeAttribute("aria-label");
          node.removeAttribute("aria-multiline");
          node.removeAttribute("tabindex");
        }
        node.oninput = () => {
          if (!state.isAdmin || state.headerSaving) return;
          state.headerDraft[key] = node.innerText.replace(/[\r\n]+/g, " ");
          state.headerError = "";
          syncHeaderFields();
        };
        node.onclick = (event) => { if (state.isAdmin) event.stopPropagation(); };
        node.onkeydown = (event) => {
          if (!state.isAdmin) return;
          if (event.isComposing || event.keyCode === 229) return;
          event.stopPropagation();
          if (event.key === "Enter") { event.preventDefault(); node.blur(); }
        };
      });
      document.title = values.siteTitle || SITE_TITLE;
      $("featureToggle")?.setAttribute("aria-label", "思悦云学习 App 最新更新内容");
    }

    function mergeHeaderInfo(rows, changes) {
      const merged = rows.map((row, index) => ({ label: row.label, value: row.value, sort_order: row.sort_order ?? index + 1 }));
      for (const [key, value] of Object.entries(changes)) {
        const index = merged.findIndex((row) => key === "version" ? /版本/.test(row.label || "") : row.label === HEADER_INFO_LABELS[key]);
        if (index >= 0) merged[index].value = value;
        else merged.push({ label: HEADER_INFO_LABELS[key], value, sort_order: Math.max(0, ...merged.map((row) => Number(row.sort_order) || 0)) + 1 });
      }
      return merged;
    }

    async function persistHeaderEdits(overrides = {}) {
      if (!state.isAdmin) throw new Error("请先进入管理员窗口。");
      refreshHeaderDraft();
      Object.assign(state.headerDraft, overrides);
      const snapshot = { ...state.headerDraft };
      const changes = {};
      for (const key of Object.keys(HEADER_INFO_LABELS)) {
        if (snapshot[key] !== state.headerBaseline[key]) {
          const value = String(snapshot[key]).trim();
          if (!value) throw new Error(`${key === "version" ? "版本号" : HEADER_INFO_LABELS[key]}不能为空。`);
          changes[key] = value;
        }
      }
      if (!Object.keys(changes).length) return false;
      const latest = await db.from("kb_basic_info").select("*").order("sort_order", { ascending: true });
      if (latest.error) throw latest.error;
      const rows = mergeHeaderInfo(latest.data || [], changes);
      const result = await db.rpc("kb_admin_replace_basic_info_v2", { p_password: state.adminPassword, p_rows: rows });
      if (result.error) throw result.error;
      state.dataRevision = (state.dataRevision || 0) + 1;
      state.info = rows;
      const saved = savedHeaderValues(rows);
      for (const key of Object.keys(HEADER_INFO_LABELS)) {
        state.headerBaseline[key] = saved[key];
        if (state.headerDraft[key] === snapshot[key]) state.headerDraft[key] = saved[key];
      }
      return true;
    }

    function renderHeader() {
      refreshHeaderDraft();
      $("loginBtn").className = state.isAdmin ? "lock admin" : "lock";
      $("loginBtn").textContent = state.headerSaving ? "保存中…" : state.isAdmin ? "退出管理" : "管理员窗口";
      $("loginBtn").disabled = state.headerSaving;
      $("loginBtn").title = state.isAdmin ? "保存标题与版本号并退出管理" : "管理员窗口";
      $("lastUpdated").innerHTML = `<span class="updated-label">最近更新时间：</span><span class="updated-value">${esc(dateTimeText(state.lastUpdatedAt))}</span>`;
      const visibleInfo = state.info.filter((f) => !/版本/.test(f.label || "") && !Object.values(HEADER_INFO_LABELS).includes(f.label));
      $("infoBar").hidden = !visibleInfo.length;
      $("infoRow").innerHTML = visibleInfo.map((f) =>
        `<span class="pill"><b>${esc(f.label)}</b>${esc(f.value)}</span>`
      ).join("");
      syncHeaderFields();
    }

    function renderFilters() {
      $("tabs").innerHTML = [
        `<button class="tab" onclick="setSection(null)" style="${!state.section ? "background:#2A2622;color:#FAF8F4" : ""}">全部</button>`,
        ...sections.map((s) => `<button class="tab" onclick="setSection('${s.key}')" style="border-color:${s.color};color:${state.section === s.key ? "#fff" : s.color};background:${state.section === s.key ? s.color : "#fff"}">${s.key}</button>`)
      ].join("");
      $("tags").style.display = isClubSection(state.section) ? "none" : "";
      if (isClubSection(state.section)) {
        $("tags").innerHTML = "";
        return;
      }
      $("tags").innerHTML = [
        `<button class="tag" onclick="setCategory(null)" style="border-color:${colorForCategory("优化更新")};color:${state.category ? colorForCategory("优化更新") : "#fff"};background:${state.category ? "transparent" : colorForCategory("优化更新")}">全部类型</button>`,
        ...categories.map((c) => `<button class="tag" onclick="setCategory('${c}')" style="border-color:${colorForCategory(c)};color:${state.category === c ? "#fff" : colorForCategory(c)};background:${state.category === c ? colorForCategory(c) : "transparent"}">${c}</button>`)
      ].join("");
      if (state.category === "报错") {
        $("tags").innerHTML += [
          `<button class="tag" onclick="setFixStatus(null)" style="border-color:${colorForCategory("报错")};color:${state.fixStatus ? colorForCategory("报错") : "#fff"};background:${state.fixStatus ? "transparent" : colorForCategory("报错")}">全部状态</button>`,
          ...fixStatuses.map((s) => `<button class="tag" onclick="setFixStatus('${s}')" style="border-color:${colorForFixStatus(s)};color:${state.fixStatus === s ? "#fff" : colorForFixStatus(s)};background:${state.fixStatus === s ? colorForFixStatus(s) : "transparent"}">${s}</button>`)
        ].join("");
      }
    }

    function renderAdminTools() {
      $("adminTools").hidden = !state.isAdmin;
      if (!state.isAdmin) {
        $("adminTools").innerHTML = "";
        return;
      }
      $("adminTools").innerHTML = `
        <button class="primary" onclick="openEditor()">＋ 新增内容</button>
        <button class="primary warn" onclick="openImport()">批量导入</button>
        <button class="primary gray" onclick="copyBackup()">复制全部备份</button>
        <button class="primary gray" onclick="openPasswordEditor()">修改密码</button>
        ${$("infoBar").hidden ? "" : `<button class="primary gray" onclick="openInfoEditor()">编辑基础信息</button>`}
        <button class="primary dark" onclick="logout()" ${state.headerSaving ? "disabled" : ""}>${state.headerSaving ? "保存中…" : "退出管理"}</button>
        ${state.headerError ? `<p class="header-save-error" role="alert">${esc(state.headerError)}</p>` : ""}
      `;
    }

    function renderList() {
      const list = filteredItems();
      const q = state.query.trim();
      const showClubEmpty = !q && !state.category && !state.fixStatus && (!state.section || isClubSection(state.section));
      if (!list.length && !showClubEmpty) {
        $("list").innerHTML = `<div class="empty">没找到相关内容，换个关键词试试</div>`;
        return;
      }
      if (q) {
        $("list").innerHTML = `
          <div class="search-result-head">
            <h2 class="search-result-title">搜索结果</h2>
            <span class="directory-count">${list.length} 条</span>
          </div>
          ${list.map(itemCard).join("")}
        `;
        return;
      }

      const visibleSections = state.section
        ? sections.filter((section) => section.key === state.section)
        : sections;
      const directories = visibleSections.map((section) => {
        const sectionItems = list.filter((it) => it.section === section.key);
        const isClub = isClubSection(section.key);
        if (!sectionItems.length && !(isClub && showClubEmpty)) return "";
        const pinnedItems = sectionItems.filter(isPinned);
        const regularSectionItems = sectionItems.filter((item) => !isPinned(item));
        const pinnedGroup = pinnedItems.length ? `
          <section class="pinned-group" aria-label="${section.key}置顶内容">
            <div class="pinned-head"><span>📌 置顶内容</span><span>${pinnedItems.length}/3 条</span></div>
            ${pinnedItems.map(itemCard).join("")}
          </section>` : "";
        const visibleCategories = state.category ? [state.category] : categories;
        const groups = pinnedGroup + (isClub ? regularSectionItems.map(itemCard).join("") : visibleCategories.map((category) => {
          const categoryItems = regularSectionItems.filter((it) => normalizeCategory(it.category) === category);
          if (!categoryItems.length) return "";
          return `
            <section class="category-group" aria-labelledby="${section.key}-${category}">
              <div class="category-head">
                <span class="dot" style="background:${colorForCategory(category)}"></span>
                <h3 id="${section.key}-${category}" class="category-title">${esc(category)}</h3>
                <span class="category-line"></span>
                <span class="category-count">${categoryItems.length} 条</span>
              </div>
              ${categoryItems.map(itemCard).join("")}
            </section>
          `;
        }).join(""));
        if (!groups && !(isClub && showClubEmpty)) return "";
        return `
          <section class="directory-section${isClub ? " club-section" : ""}" aria-labelledby="${isClub ? "club-resources" : section.key}">
            <div class="directory-head">
              <h2 id="${isClub ? "club-resources" : section.key}" class="directory-title">
                <span class="directory-mark" style="background:${section.color}"></span>
                ${esc(section.key)}
              </h2>
              <span class="directory-count">${sectionItems.length} 条内容</span>
            </div>
            ${groups || `<div class="empty">暂无资源</div>`}
          </section>
        `;
      }).join("");
      const isUnfilteredHome = !state.section && !state.category && !state.fixStatus;
      $("list").innerHTML = isUnfilteredHome ? `<div class="directory-columns">${directories}</div>` : directories;
    }

    function itemCard(it) {
      if (it._featureSearchResult) {
        const summary = it.content;
        return `
          <article class="card feature-search-card">
            <button class="card-head" onclick="openFeatureSearchResult(${it._featureIndex}, event, ${esc(JSON.stringify(it._archiveId || null))})">
              <span class="dot" style="background:var(--yw-dk);margin-top:7px"></span>
              <span class="card-title-wrap">
                <span class="title">${esc(it.title)}</span>
                <span class="mini-tags"><span class="mini-tag" style="border-color:var(--yw-dk);color:#7b6205;background:#fff9df">${it._archiveId ? "往期更新" : "本次上新"}</span>${it._featureVersion ? `<span class="mini-tag">版本 ${esc(it._featureVersion)}</span>` : ""}</span>
                <span class="feature-search-summary">${esc(summary)}</span>
              </span>
              <span class="feature-search-open">打开查看 ›</span>
            </button>
          </article>`;
      }
      const open = state.expanded.has(String(it.id));
      const pinned = isPinned(it);
      const category = normalizeCategory(it.category);
      const showCategory = !isClubSection(it.section);
      const status = normalizeFixStatus(it.fix_status);
      const adminActions = state.isAdmin ? `
        <div class="item-admin-actions" aria-label="词条管理操作">
          <button class="link-btn pin" onclick="togglePinnedItem('${it.id}', this)">${pinned ? "取消置顶" : "置顶"}</button>
          <button class="link-btn" onclick='openEditor(${esc(JSON.stringify(it))})'>编辑</button>
          <button class="link-btn danger" onclick="requestDeleteItem('${it.id}')">删除</button>
        </div>` : "";
      return `
        <article id="kb-item-${esc(String(it.id))}" class="card${pinned ? " pinned" : ""}">
          ${adminActions}
          <button class="card-head" onclick="toggleItem('${it.id}')" aria-expanded="${open}">
            <span class="dot" style="background:${colorForCategory(category)};margin-top:7px"></span>
            <span class="card-title-wrap">
              <span class="title">${esc(it.title)}</span>
              ${showCategory || pinned ? `<span class="mini-tags">
                ${pinned ? `<span class="mini-tag pinned">📌 置顶</span>` : ""}
                ${showCategory ? `<span class="mini-tag ${category === "报错" ? "error" : ""}">${esc(category || "未分类")}</span>` : ""}
                ${showCategory && category === "报错" ? `<span class="mini-tag" style="border-color:${colorForFixStatus(status)};color:${colorForFixStatus(status)}">${esc(status)}</span>` : ""}
              </span>` : ""}
            </span>
            <span>${open ? "⌄" : "›"}</span>
          </button>
          ${open ? itemBody(it) : ""}
        </article>
      `;
    }

    function itemBody(it) {
      const category = normalizeCategory(it.category);
      const showCategory = !isClubSection(it.section);
      const status = normalizeFixStatus(it.fix_status);
      const statusClass = status === "已修复" ? "fixed" : status === "后续优化" ? "future" : "fixing";
      const imageUrls = splitUrls(it.image_url);
      const imageGrid = imageUrls.length ? `<div class="media-grid">${imageUrls.map((url, index) => `
        <div class="media-thumb-wrap">
          <button class="media-thumb-btn" title="点击放大图片" data-url="${esc(mediaUrl(url))}" data-alt="${esc(it.title)} 图片${index + 1}" onclick="openImagePreview(this.dataset.url, this.dataset.alt)">
            <img class="media-thumb" src="${esc(mediaUrl(url))}" alt="${esc(it.title)} 图片${index + 1}" onerror="this.parentElement.parentElement.style.display='none'">
            <span class="media-preview-label">点击预览</span>
          </button>
          <button class="image-download" data-url="${esc(mediaUrl(url))}" data-name="${esc(it.title)}-图片${index + 1}" onclick="downloadOriginalImage(event, this.dataset.url, this.dataset.name)">下载原图</button>
        </div>`).join("")}</div>` : "";
      const videoMedia = !it.video_url ? "" : isVideoUrl(it.video_url) ? `
        <div class="video-player-wrap">
          <video class="video-player" src="${esc(mediaUrl(it.video_url))}" controls playsinline preload="metadata"></video>
          <div class="video-player-actions"><a class="video-link" href="${esc(mediaUrl(it.video_url))}" target="_blank" rel="noreferrer">↗ 打开原视频</a></div>
        </div>` : `<a class="video-link" href="${esc(mediaUrl(it.video_url))}" target="_blank" rel="noreferrer">⬇ 打开视频/网盘链接</a>`;
      const media = imageGrid + videoMedia;
      const updatedAt = it.updated_at || it.created_at;
      const updatedLabel = state.isAdmin
        ? `更新时间：${dateTimeText(updatedAt)}`
        : `更新日期：${yearMonthText(updatedAt)}`;
      return `
        <div class="body">
          <div class="item-info-row">
            <div class="crumb">${esc(it.section)} ${showCategory && category ? `<span style="color:${colorForCategory(category)}">· ${esc(category)}</span>` : ""}</div>
            <span class="item-updated">${esc(updatedLabel)}</span>
          </div>
          ${showCategory && category === "报错" ? `<div class="status-panel ${statusClass}"><b>${esc(status)}</b>${linkifyText(it.fix_note || (status === "修复中" ? DEFAULT_FIXING_NOTE : "暂无补充说明。"))}</div>` : ""}
          <div class="content">${renderBodyContent(it.content)}</div>
          ${media}
        </div>
      `;
    }

    window.setSection = (s) => {
      state.section = state.section === s && !state.query.trim() ? null : s;
      state.category = null;
      state.fixStatus = null;
      state.query = "";
      $("query").value = "";
      $("clearQuery").hidden = true;
      render();
    };
    window.setCategory = (c) => { state.category = state.category === c ? null : c; state.fixStatus = null; render(); };
    window.setFixStatus = (s) => { state.fixStatus = state.fixStatus === s ? null : s; render(); };
    window.toggleItem = (id) => {
      const key = String(id);
      if (state.expanded.has(key)) state.expanded.delete(key);
      else state.expanded.add(key);
      renderList();
    };
    window.openImagePreview = (url, alt = "图片大图预览") => {
      $("lightboxImage").src = url;
      $("lightboxImage").alt = alt;
      $("lightboxDownload").dataset.url = url;
      $("lightboxDownload").dataset.name = alt;
      $("imageLightbox").classList.add("show");
    };
    window.downloadOriginalImage = async (event, url, name = "原图") => {
      event?.stopPropagation();
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("download failed");
        const blob = await response.blob();
        const extension = (blob.type.split("/")[1] || url.match(/\.([a-zA-Z0-9]+)(?:\?|$)/)?.[1] || "jpg").replace("jpeg", "jpg");
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = `${safeFileName(name) || "image"}.${extension}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      } catch {
        window.open(url, "_blank", "noopener,noreferrer");
        showToast("已打开原图，请长按或右键保存");
      }
    };
    window.closeImagePreview = () => {
      $("imageLightbox").classList.remove("show");
      $("lightboxImage").removeAttribute("src");
    };

    $("query").addEventListener("input", (e) => {
      state.query = e.target.value;
      $("clearQuery").hidden = !state.query;
      renderList();
    });
    $("clearQuery").addEventListener("click", () => {
      state.query = "";
      $("query").value = "";
      $("clearQuery").hidden = true;
      renderList();
    });
    $("loginBtn").addEventListener("click", () => state.isAdmin ? logoutAdmin() : openLogin());

    function modal(html, narrow = false, extraClass = "") {
      const modalClass = ["modal", narrow ? "narrow" : "", extraClass].filter(Boolean).join(" ");
      $("modalLayer").innerHTML = `<div class="${modalClass}"><button class="close" onclick="closeModal()">×</button>${html}</div>`;
      $("modalLayer").classList.add("show");
    }
    function lockModalForSave() {
      const currentModal = document.querySelector("#modalLayer .modal");
      const controls = Array.from(currentModal?.querySelectorAll("button, input, select, textarea, [contenteditable='true']") || []).map((node) => ({ node, disabled: node.disabled, editable: node.getAttribute("contenteditable") }));
      currentModal?.setAttribute("aria-busy", "true");
      for (const { node, editable } of controls) {
        if (editable !== null) node.contentEditable = "false";
        else node.disabled = true;
      }
      return () => {
        currentModal?.removeAttribute("aria-busy");
        for (const { node, disabled, editable } of controls) {
          if (editable !== null) node.setAttribute("contenteditable", editable);
          else node.disabled = disabled;
        }
      };
    }
    window.closeModal = () => {
      if (state.featureSaving || state.itemSaving || state.itemDeleting) return;
      const restoreFeatureModule = state.featureEditing;
      for (const entry of state.pendingImageFiles) URL.revokeObjectURL(entry.previewUrl);
      state.pendingImageFiles = [];
      videoSelectionToken += 1;
      clearPendingVideoFile();
      state.featureDraftVersion = "";
      for (const poster of state.featureDraftPosters) if (poster.previewUrl) URL.revokeObjectURL(poster.previewUrl);
      state.featureDraftPosters = [];
      for (const item of state.featureDraftItems) if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      state.featureDraftItems = [];
      state.featureEditing = false;
      richEditors.clear();
      $("modalLayer").classList.remove("show");
      $("modalLayer").innerHTML = "";
      if (restoreFeatureModule) renderFeature();
    };
    $("modalLayer").addEventListener("click", (e) => { if (e.target.id === "modalLayer") closeModal(); });

    function openLogin() {
      modal(`
        <div class="modal-title">管理员登录</div>
        <div class="hint">非管理员请勿尝试此位置。</div>
        <label>密码</label>
        <input id="password" class="field" type="password" autocomplete="current-password" placeholder="输入管理密码">
        <div id="loginError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="login()">进入管理页面</button>
      `, true);
      setTimeout(() => $("password")?.focus(), 50);
    }

    window.login = async () => {
      const password = $("password").value;
      const { data, error } = await db.rpc("kb_check_admin_password_v2", { p_password: password });
      if (error || data !== true) {
        $("loginError").textContent = "密码不对，再试一下。";
        return;
      }
      state.adminPassword = password;
      state.isAdmin = true;
      localStorage.setItem("kb-admin-password", password);
      closeModal();
      render();
    };

    async function logoutAdmin() {
      if (state.headerSaving) return;
      if (state.featureSaving || state.itemSaving || state.itemDeleting) { showToast("正在处理，请完成后再退出管理"); return; }
      state.headerSaving = true;
      state.headerError = "";
      renderHeader();
      renderAdminTools();
      try {
        const saved = await persistHeaderEdits();
        state.adminPassword = "";
        state.isAdmin = false;
        state.headerDraft = null;
        state.headerBaseline = null;
        localStorage.removeItem("kb-admin-password");
        closeModal();
        showToast(saved ? "标题与版本号已保存，已退出管理" : "已退出管理");
      } catch (error) {
        state.headerError = `标题与版本号尚未保存：${error.message || "请检查网络后重试。"} 请再次点击退出管理重试。`;
        showToast("保存失败，已保留编辑内容和管理状态");
      } finally {
        state.headerSaving = false;
        render();
      }
    }
    window.logout = logoutAdmin;

    window.openEditor = (item = null) => {
      for (const entry of state.pendingImageFiles) URL.revokeObjectURL(entry.previewUrl);
      state.pendingImageFiles = [];
      videoSelectionToken += 1;

    window.previewUpload = async (kind) => {
      const input = kind === "image" ? $("editImageFile") : $("editVideoFile");
      const files = Array.from(input?.files || []);
      if (!files.length) return;
      if (kind === "image") {
        const existingUrls = splitUrls($("editImage")?.value);
        const uniqueNewFiles = files.filter((file) => !state.pendingImageFiles.some((entry) =>
          entry.file.name === file.name && entry.file.size === file.size && entry.file.lastModified === file.lastModified
        ));
        if (existingUrls.length + state.pendingImageFiles.length + uniqueNewFiles.length > 5) {
          $("editError").textContent = "图片最多保留5张；前面已选图片仍然保留，请减少这次选择的数量。";
          input.value = "";
          return;

        $("editError").textContent = "";
        state.pendingImageFiles.push(...uniqueNewFiles.map((file) => ({ file, previewUrl: URL.createObjectURL(file) })));
        input.value = "";
        renderMediaPreview("image");
      } else {
        const file = files[0];
        const token = ++videoSelectionToken;
        if (!String(file.type || "").startsWith("video/") && !/\.(mp4|webm|mov|m4v|ogv|ogg)$/i.test(file.name || "")) {
          $("editError").textContent = "请选择 MP4、MOV、WebM 或 OGV 视频文件。";

          return;

    async function uploadImageFiles() {
      const existingUrls = splitUrls($("editImage").value);
      const files = state.pendingImageFiles.map((entry) => entry.file);
      if (existingUrls.length + files.length > 5) {
        throw new Error("图片最多保留5张，请减少已粘贴链接或重新选择文件。");
      }
      const uploadedUrls = [];
      for (const file of files) {
        const path = `images/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeFileName(file.name)}`;
        const adminDb = window.siyueCloud.createClient(SUPABASE_URL, SUPABASE_KEY, {
          global: { headers: { "x-kb-admin-password": state.adminPassword } }
        });
        const { error } = await adminDb.storage.from("kb-media").upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type || undefined
        });
        if (error) throw error;
        uploadedUrls.push(db.storage.from("kb-media").getPublicUrl(path).data.publicUrl);
      }
      return [...existingUrls, ...uploadedUrls].slice(0, 5).join("\n");
    }

    async function uploadVideoFile() {
      if (!state.pendingVideoFile) return $("editVideo").value.trim();
      const file = state.pendingVideoFile.file;
      const path = `videos/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeFileName(file.name)}`;
      const adminDb = window.siyueCloud.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: { headers: { "x-kb-admin-password": state.adminPassword } }
      });
      const { error } = await adminDb.storage.from("kb-media").upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || undefined
      });

      return db.storage.from("kb-media").getPublicUrl(path).data.publicUrl;

      }
      state.itemSaving = true;
      const releaseControls = lockModalForSave();

        videoUrl = await uploadVideoFile();
      } catch (err) {
        $("editError").textContent = `上传失败：${err.message || "请确认 Supabase 上传空间已经创建。"}`;
        return;

        category,

        content,
        fix_status: category === "报错" ? $("editFixStatus").value : "",
        fix_note: category === "报错" ? $("editFixNote").value.trim() : "",
        image_url: imageUrl,
        video_url: videoUrl,
        keywords: ""
      };
      const existingItem = state.items.find((item) => String(item.id) === String(id));
      const preservePin = isPinned(existingItem);
      row.keywords = keywordsWithPin([row.title, bodyContentText(row.content), row.fix_note].filter(Boolean).join(" "), preservePin);
      if (!row.title || !bodyContentText(row.content).trim()) {
        $("editError").textContent = "标题和内容都要填写。";
        return;
      }
      if (preservePin && existingItem?.section !== row.section) {
        const targetPinnedCount = state.items.filter((item) =>
          item.section === row.section && isPinned(item) && String(item.id) !== String(id)
        ).length;
        if (targetPinnedCount >= 3) {
          $("editError").textContent = `${row.section}已经置顶3条，请先取消一条置顶再移动。`;
          return;
        }
      }
      const res = await db.rpc("kb_admin_save_item_v2", {
        p_password: state.adminPassword,
        p_id: id || null,
        p_section: row.section,
        p_category: row.category,
        p_title: row.title,
        p_content: row.content,
        p_fix_status: row.fix_status,
        p_fix_note: row.fix_note,
        p_image_url: row.image_url,
        p_video_url: row.video_url,
        p_keywords: row.keywords
      });
      if (res.error) {
        $("editError").textContent = `保存失败：${res.error.message || "请重新登录管理员窗口。"}`;
        return;
      }
      const saved = Array.isArray(res.data) ? res.data[0] : res.data;
      if (saved?.id) {
        state.dataRevision = (state.dataRevision || 0) + 1;
        state.items = [saved, ...state.items.filter((item) => String(item.id) !== String(saved.id))]
          .sort((a, b) => {
            const timeDiff = new Date(b.created_at || 0) - new Date(a.created_at || 0);
            return timeDiff || String(b.id).localeCompare(String(a.id));
          });
        state.expanded.add(String(saved.id));
        state.knownItemIds.add(String(saved.id));
      }
      state.itemSaving = false;
      closeModal();
      render();
      showToast(id ? "内容已更新" : "内容已发布");
      await loadAll();
      } catch (error) {
        const message = $("editError");
        if (message) message.textContent = `保存失败：${error.message || "请检查网络后重试。"}`;

        releaseControls();
      }

      if (button) button.disabled = true;
      const nextKeywords = keywordsWithPin(item.keywords, nextPinned);
      const res = await db.rpc("kb_admin_save_item_v2", {

        p_category: normalizeCategory(item.category),

        p_keywords: nextKeywords
      });

    function parseImportText(text) {
      return text.split(/\n\s*\n|\n-{3,}\n/).map((b) => b.trim()).filter(Boolean).map((block) => {
        const row = { section: "学生端", category: "报错", title: "", content: "", fix_status: "修复中", fix_note: "", image_url: "", video_url: "", keywords: "", pinned: false };
        for (const raw of block.split("\n")) {
          const line = raw.trim();
          const m = line.match(/^(标题|Q|内容|正文|A|板块|分类|类型|修复状态|状态|状态说明|修复说明|图片|视频|置顶)[:：]\s*(.*)$/i);
          if (!m) {
            if (row.content) row.content += "\n" + line;
            else if (row.title) row.title += "\n" + line;
            continue;
          }
          const key = m[1];
          const value = m[2];
          if (/^(标题|Q)$/i.test(key)) row.title = value;
          else if (/^(内容|正文|A)$/i.test(key)) row.content = value;
          else if (key === "板块") row.section = sections.some((s) => s.key === value) ? value : "学生端";
          else if (key === "分类" || key === "类型") row.category = categories.includes(value) ? value : normalizeCategory(value);
          else if (key === "修复状态" || key === "状态") row.fix_status = normalizeFixStatus(value);
          else if (key === "状态说明" || key === "修复说明") row.fix_note = value;
          else if (key === "图片") row.image_url = value;
          else if (key === "视频") row.video_url = value;
          else if (key === "置顶") row.pinned = /^(是|true|1|yes)$/i.test(value);
        }
        if (isClubSection(row.section)) {
          row.category = "情况说明";
          row.fix_status = "";
          row.fix_note = "";
        }
        row.content = normalizeBodyContent(row.content);
        row.keywords = keywordsWithPin([row.title, bodyContentText(row.content), row.fix_note].filter(Boolean).join(" "), row.pinned);
        delete row.pinned;
        if (row.category === "报错" && normalizeFixStatus(row.fix_status) === "修复中" && !row.fix_note) {
          row.fix_note = DEFAULT_FIXING_NOTE;
        }
        return row;
      }).filter((r) => r.title && bodyContentText(r.content).trim());
    }

        `标题：${it.title}\n内容：${it.content}\n板块：${it.section}` +
        (normalizeCategory(it.category) ? `\n分类：${normalizeCategory(it.category)}` : "") +
        (normalizeCategory(it.category) === "报错" ? `\n修复状态：${normalizeFixStatus(it.fix_status)}` : "") +
        (normalizeCategory(it.category) === "报错" && it.fix_note ? `\n状态说明：${it.fix_note}` : "") +
        (it.image_url ? `\n图片：${it.image_url}` : "") +
        (it.video_url ? `\n视频：${it.video_url}` : "") +
        (isPinned(it) ? `\n置顶：是` : "")
      ).join("\n\n---\n\n");
      await navigator.clipboard.writeText(text);
      alert("已复制全部备份。");
    };

    window.openInfoEditor = () => {
      const rows = state.info.length ? state.info : [{ label: "当前最新版本号：", value: "" }];
      modal(`
        <div class="modal-title">编辑基础信息</div>
        <div id="infoRows">${rows.map((r) => infoRowHtml(r.label, r.value)).join("")}</div>
        <button class="tag" onclick="addInfoRow()">添加一行</button>
        <div id="infoError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="saveInfo()">保存</button>
      `);
    };
    function infoRowHtml(label = "", value = "") {
      return `<div class="row"><input class="field info-label" value="${esc(label)}" placeholder="标签，如：版本号"><input class="field info-value" value="${esc(value)}" placeholder="内容，如：v1.0.0"><button class="clear" onclick="this.parentElement.remove()">×</button></div>`;
    }
    window.addInfoRow = () => $("infoRows").insertAdjacentHTML("beforeend", infoRowHtml());
    window.saveInfo = async () => {
      const labels = Array.from(document.querySelectorAll(".info-label"));
      const values = Array.from(document.querySelectorAll(".info-value"));
      const rows = labels.map((el, i) => ({ label: el.value.trim(), value: values[i].value.trim(), sort_order: i + 1 })).filter((r) => r.label && r.value);
      const { error } = await db.rpc("kb_admin_replace_basic_info_v2", { p_password: state.adminPassword, p_rows: rows });
      if (error) {
        $("infoError").textContent = `保存失败：${error.message || "请重新登录管理员窗口。"}`;
        return;
      }
      state.info = rows;
      closeModal();
      render();
      showToast("基础信息已保存");
      await loadAll();
    };

    window.openPasswordEditor = () => {
      modal(`
        <div class="modal-title">修改管理密码</div>
        <label>新密码</label>
        <input id="newPw1" class="field" type="password" placeholder="至少4位">
        <label>确认新密码</label>
        <input id="newPw2" class="field" type="password" placeholder="再输入一遍">
        <div id="pwError" class="error"></div>
        <button class="primary" style="width:100%;margin-top:18px" onclick="changePassword()">保存新密码</button>
      `, true);
      setTimeout(() => $("newPw1")?.focus(), 50);
    };

    window.changePassword = async () => {
      const pw1 = $("newPw1").value;
      const pw2 = $("newPw2").value;
      if (pw1.length < 4) {
        $("pwError").textContent = "密码至少4位。";
        return;
      }
      if (pw1 !== pw2) {
        $("pwError").textContent = "两次输入的密码不一致。";
        return;
      }
      const { error } = await db.rpc("kb_admin_change_password_v2", {
        p_old_password: state.adminPassword,
        p_new_password: pw1
      });
      if (error) {
        $("pwError").textContent = "修改失败，请确认当前管理状态仍然有效。";
        return;
      }
      state.adminPassword = pw1;
      localStorage.setItem("kb-admin-password", pw1);
      closeModal();
      alert("管理密码已修改。");
    };

    init();
    document.addEventListener("click", (event) => {
      if (state.featureOpen && !event.target.closest("#featureModule") && !event.target.closest("#imageLightbox") && !event.target.closest("#updateTour")) {
        state.featureOpen = false;
        state.featureFocusIndex = null;
        renderFeature();
      }
    });
    $("featureBackdrop").addEventListener("click", () => {
      state.featureOpen = false;
      state.featureFocusIndex = null;
      renderFeature();
    });
  </script>
</body>
</html>
